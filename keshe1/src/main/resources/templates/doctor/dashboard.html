<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医生工作站 - 医疗健康管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/unified-style.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 周次选择相关样式 */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            margin-top: 10px;
        }

        .calendar-day {
            padding: 5px;
            text-align: center;
            border: 1px solid #dee2e6;
            cursor: pointer;
            background-color: #fff;
        }

        .calendar-day.today {
            background-color: #007bff;
            color: white;
            font-weight: bold;
        }

        .calendar-day.selected-week {
            border: 2px solid #007bff;
            font-weight: bold;
        }

        .calendar-day.fw-bold {
            font-weight: bold;
        }

        .calendar-day.current-month {
            color: #000;
        }

        .calendar-day.other-month {
            color: #ccc;
        }

        .calendar-day.selected {
            border: 2px solid #007bff;
            border-radius: 4px;
            background-color: #e7f3ff;
        }

        .table th, .table td {
            vertical-align: middle !important;
            padding: 0.25rem 0.25rem !important;
        }

        .schedule-cell.past {
            background-color: #e9ecef;
            color: #6c757d;
        }

        .schedule-cell.selected {
            background-color: #d1ecf1;
            border-color: #0c5460;
        }

        .schedule-cell.past.selected {
            background-color: #d1ecf1 !important;
            border-color: #0c5460;
            color: inherit;
        }

        .schedule-cell.past.selected:hover {
            background-color: #d1ecf1 !important;
            border-color: #0c5460 !important;
            color: inherit !important;
        }

        .schedule-cell:hover {
            background-color: #d1ecf1 !important;
            position: relative;
            z-index: 1;
        }

        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif;
            background-color: #F5F7FA;
            overflow-x: hidden;
        }

        /* ============ 左侧侧边栏 ============ */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 260px;
            background: linear-gradient(135deg, #E6F4FF 0%, #FFFFFF 100%);
            box-shadow: 3px 0 15px rgba(0, 0, 0, 0.08);
            z-index: 1000;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar.collapsed {
            width: 70px;
        }

        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(0, 123, 255, 0.3);
            border-radius: 3px;
        }

        .sidebar-header {
            padding: 25px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(0, 123, 255, 0.1);
            transition: all 0.3s;
        }

        .sidebar.collapsed .sidebar-header {
            padding: 15px 5px;
        }

        .sidebar-header .user-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #36B37E, #00A3BF);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .sidebar.collapsed .user-avatar {
            width: 40px;
            height: 40px;
            font-size: 18px;
        }

        .sidebar-header h5 {
            font-size: 18px;
            font-weight: 600;
            color: #1A1A1A;
            margin-bottom: 5px;
            transition: all 0.3s;
        }

        .sidebar.collapsed .sidebar-header h5,
        .sidebar.collapsed .sidebar-header small {
            display: none;
        }

        .sidebar-header small {
            color: #6B7280;
            font-size: 12px;
        }

        .sidebar-nav {
            padding: 15px 0;
        }

        .nav-item {
            margin: 5px 15px;
        }

        .sidebar.collapsed .nav-item {
            margin: 5px 10px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 14px 15px;
            color: #4B5563;
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 14px;
            font-weight: 500;
            position: relative;
            overflow: hidden;
        }

        .nav-link:hover {
            background: linear-gradient(90deg, rgba(54, 179, 126, 0.1) 0%, rgba(0, 163, 191, 0.1) 100%);
            color: #36B37E;
            transform: translateX(3px);
        }

        .nav-link.active {
            background: linear-gradient(90deg, #36B37E 0%, #00A3BF 100%);
            color: #FFFFFF;
            box-shadow: 0 4px 12px rgba(54, 179, 126, 0.3);
        }

        .nav-link i {
            min-width: 20px;
            margin-right: 12px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .sidebar.collapsed .nav-link i {
            margin-right: 0;
        }

        .sidebar.collapsed .nav-link .nav-text {
            display: none;
        }

        .nav-link .chevron {
            margin-left: auto;
            font-size: 12px;
            transition: transform 0.3s;
        }

        .nav-link.expanded .chevron {
            transform: rotate(180deg);
        }

        .submenu {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .submenu.show {
            max-height: 500px;
        }

        .submenu .nav-link {
            padding-left: 47px;
            font-size: 13px;
            color: #6B7280;
        }

        .sidebar.collapsed .submenu {
            display: none;
        }

        .toggle-sidebar-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #FFFFFF;
            border: 2px solid #E6F4FF;
            color: #36B37E;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            z-index: 10;
        }

        .toggle-sidebar-btn:hover {
            background: #36B37E;
            color: #FFFFFF;
            box-shadow: 0 4px 12px rgba(54, 179, 126, 0.3);
        }

        /* ============ 主内容区域 ============ */
        .main-content {
            margin-left: 260px;
            padding: 30px;
            transition: margin-left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            min-height: 100vh;
            padding-bottom: 100px;
        }

        .main-content.full-width {
            margin-left: 70px;
        }

        .dashboard-header {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 28px 32px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            margin-bottom: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dashboard-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1A1A1A;
            margin-bottom: 6px;
        }

        .dashboard-header p {
            font-size: 14px;
            color: #9CA3AF;
            margin: 0;
        }

        .header-actions .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            margin-left: 10px;
        }

        .btn-primary-custom {
            background: linear-gradient(135deg, #36B37E 0%, #00A3BF 100%);
            border: none;
            color: white;
        }

        .btn-primary-custom:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 6px 20px rgba(54, 179, 126, 0.4);
        }

        .btn-outline-custom {
            border: 2px solid #E5E7EB;
            color: #6B7280;
            background: white;
        }

        .btn-outline-custom:hover {
            border-color: #36B37E;
            color: #36B37E;
            background: #F0FDF4;
        }

        /* ============ 卡片样式 ============ */
        .card {
            background: #FFFFFF;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid #F3F4F6;
            margin-bottom: 24px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card:hover {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            transform: translateY(-4px);
        }

        .card-header {
            padding: 20px 24px;
            border-bottom: 1px solid #F3F4F6;
            background: transparent;
        }

        .card-header h5 {
            font-size: 18px;
            font-weight: 600;
            color: #1A1A1A;
            margin: 0;
        }

        .card-body {
            padding: 24px;
        }

        /* 统计卡片 */
        .stat-card {
            text-align: center;
            padding: 24px 16px;
            background: linear-gradient(135deg, #FFFFFF 0%, #F9FAFB 100%);
            border: 2px solid #E6F4FF;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(54, 179, 126, 0.1) 0, transparent 70%);
            transition: all 0.5s;
        }

        .stat-card:hover::before {
            top: -30%;
            right: -30%;
        }

        .stat-card .icon {
            font-size: 32px;
            color: #36B37E;
            margin-bottom: 12px;
        }

        .stat-card .number {
            font-size: 32px;
            font-weight: 700;
            color: #1A1A1A;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
        }

        .stat-card .label {
            font-size: 14px;
            color: #6B7280;
            font-weight: 500;
            position: relative;
            z-index: 1;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .sidebar {
                width: 70px;
            }
            .sidebar-header h5,
            .sidebar-header small,
            .nav-text,
            .submenu {
                display: none;
            }
            .main-content {
                margin-left: 70px;
            }
        }
    </style>
</head>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    /**
     * 辅助函数：手动执行容器中的 script 标签
     * 解决 innerHTML 插入的 script 不执行的问题
     */
    function executeScripts(container) {
        // 找到容器内所有的 script 标签
        const scripts = container.querySelectorAll('script');

        scripts.forEach(oldScript => {
            // 创建一个新的 script 元素
            const newScript = document.createElement('script');

            // 复制属性 (如 src, type 等)
            Array.from(oldScript.attributes).forEach(attr => {
                newScript.setAttribute(attr.name, attr.value);
            });

            // 复制内容
            newScript.textContent = oldScript.textContent;

            // 将旧标签替换为新标签（这会触发浏览器执行脚本）
            oldScript.parentNode.replaceChild(newScript, oldScript);
        });
    }

    // ============ 全局函数定义 ============

    // 子菜单折叠/展开
    window.toggleSubmenu = function(linkElement) {
        const submenu = linkElement.nextElementSibling;
        const allSubmenus = document.querySelectorAll('.submenu');
        const allLinks = document.querySelectorAll('.nav-link');

        // 关闭其他子菜单
        allSubmenus.forEach(menu => {
            if (menu !== submenu && menu.classList.contains('show')) {
                menu.classList.remove('show');
            }
        });

        // 移除其他链接的expanded状态
        allLinks.forEach(link => {
            if (link !== linkElement && link.classList.contains('expanded')) {
                link.classList.remove('expanded');
            }
        });

        // 切换当前子菜单
        if (submenu) {
            submenu.classList.toggle('show');
            linkElement.classList.toggle('expanded');
        }
    };

    // 侧边栏折叠
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('mainContent');
        const toggleIcon = document.getElementById('toggleIcon');

        sidebar.classList.toggle('collapsed');
        mainContent.classList.toggle('full-width');

        if (sidebar.classList.contains('collapsed')) {
            toggleIcon.classList.remove('fa-angles-left');
            toggleIcon.classList.add('fa-angles-right');
        } else {
            toggleIcon.classList.remove('fa-angles-right');
            toggleIcon.classList.add('fa-angles-left');
        }
    }

    // ============ 头像同步更新机制 ============

    // 1. 加载医生侧边栏头像
    function loadDashboardUserAvatar() {
        fetch('/doctor/avatar/get', {
            method: 'GET',
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error('网络响应错误');
                }
                return response.json();
            })
            .then(data => {
                if (data.success) {
                    updateDashboardSidebarAvatar(data);
                } else {
                    console.error('获取头像失败:', data.message);
                    // 使用默认头像
                    showDefaultAvatar(data.defaultAvatar || 'D');
                }
            })
            .catch(error => {
                console.error('获取头像请求失败:', error);
                // 显示默认头像
                showDefaultAvatar('D');
            });
    }

    // 2. 更新侧边栏头像
    function updateDashboardSidebarAvatar(data) {
        const sidebarAvatarPlaceholder = document.getElementById('sidebarAvatarPlaceholder');
        const sidebarAvatarImage = document.getElementById('sidebarAvatarImage');
        const sidebarUserName = document.getElementById('sidebarUserName');
        const sidebarUserEmpId = document.getElementById('sidebarUserEmpId');

        // 更新用户姓名
        if (sidebarUserName && data.realName) {
            sidebarUserName.textContent = data.realName;
        }

        // 更新工号（如果返回了工号信息）
        if (sidebarUserEmpId && data.employeeId) {
            sidebarUserEmpId.textContent = data.employeeId;
        }

        // 也更新只读页面中的头像（如果存在）
        const readOnlyAvatarPlaceholder = document.getElementById('doctorAvatarPlaceholder');
        const readOnlyAvatarImage = document.getElementById('doctorAvatarImage');
        const readOnlyDisplayName = document.getElementById('doctorDisplayName');

        if (readOnlyDisplayName && data.realName) {
            readOnlyDisplayName.textContent = data.realName;
        }

        if (data.hasAvatar && data.avatarUrl) {
            // 更新侧边栏头像
            if (sidebarAvatarImage) {
                sidebarAvatarImage.src = data.avatarUrl + '?t=' + new Date().getTime();
                sidebarAvatarImage.style.display = 'block';
            }
            if (sidebarAvatarPlaceholder) {
                sidebarAvatarPlaceholder.style.display = 'none';
            }

            // 更新只读页面头像
            if (readOnlyAvatarImage) {
                readOnlyAvatarImage.src = data.avatarUrl + '?t=' + new Date().getTime();
                readOnlyAvatarImage.style.display = 'block';
            }
            if (readOnlyAvatarPlaceholder) {
                readOnlyAvatarPlaceholder.style.display = 'none';
            }

            // 设置背景渐变
            const avatarContainer = document.querySelector('.user-avatar');
            if (avatarContainer) {
                avatarContainer.style.background = 'none';
            }
        } else {
            // 无头像：显示姓名首字母
            showDefaultAvatar(data.defaultAvatar || 'D');

            // 更新只读页面
            if (readOnlyAvatarPlaceholder) {
                readOnlyAvatarPlaceholder.textContent = data.defaultAvatar || '医';
                readOnlyAvatarPlaceholder.style.display = 'flex';
            }
            if (readOnlyAvatarImage) {
                readOnlyAvatarImage.style.display = 'none';
            }
        }
    }

    // 3. 显示默认头像（姓名首字母）
    function showDefaultAvatar(initial) {
        const sidebarAvatarPlaceholder = document.getElementById('sidebarAvatarPlaceholder');
        const sidebarAvatarImage = document.getElementById('sidebarAvatarImage');
        const avatarContainer = document.querySelector('.user-avatar');

        sidebarAvatarImage.style.display = 'none';
        sidebarAvatarPlaceholder.style.display = 'flex';
        sidebarAvatarPlaceholder.textContent = initial;

        // 确保有渐变背景
        if (avatarContainer) {
            avatarContainer.style.background = 'linear-gradient(135deg, #36B37E, #00A3BF)';
        }
    }

        if (btnGroup) {

        return tempDiv.innerHTML;

    // 导出排班表
    function exportSchedule(exportType) {
        // 获取当前选中的周
        const selectedWeek = getSelectedWeek(); // 需要根据实际选择的周来确定日期范围

        // 准备导出数据
        const exportData = {
            exportType: exportType,
            startDate: selectedWeek.startDate,
            endDate: selectedWeek.endDate,
            departmentId: null // 医生端导出时不需要指定科室ID，后端会根据当前用户自动获取
        };

        // 发送导出请求
        fetch('/schedule/export-schedule', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(exportData)
        })
            .then(response => {
                if (response.ok) {
                    return response.blob();
                }
                throw new Error('导出失败');
            })
            .then(blob => {
                // 创建下载链接
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = exportType === 'week' ? `周排班表_${new Date().toISOString().slice(0, 10)}.xlsx` : `月排班表_${new Date().toISOString().slice(0, 10)}.xlsx`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
            })
            .catch(error => {
                console.error('导出排班表时出错:', error);
                alert('导出排班表失败');
            });
    }

    // 更新周视图的日期显示
    function updateWeekViewDates() {
        // 获取当前显示周的周一
        const weekStart = window.currentWeekStart || getMonday(new Date());

        // 计算一周中每天的日期
        const dates = [];
        for (let i = 0; i < 7; i++) {
            const date = new Date(weekStart);
            date.setDate(weekStart.getDate() + i);
            dates.push(date);
        }

        // 更新表格中的日期显示
        const dayNames = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
        const dayLabels = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];

        // 更新月份显示
        const monthElement = document.getElementById('current-month');
        if (monthElement) {
            monthElement.textContent = (dates[0].getMonth() + 1) + '月';
        }

        // 更新每天的日期显示
        for (let i = 0; i < 7; i++) {
            const dateElement = document.getElementById('date-' + dayNames[i]);
            if (dateElement) {
                dateElement.textContent = dates[i].getDate() + '日';
            }

            // 更新每个单元格的data-date属性
            const morningCell = document.getElementById(dayNames[i] + '-morning');
            const afternoonCell = document.getElementById(dayNames[i] + '-afternoon');

            if (morningCell) {

            }
            if (afternoonCell) {
                afternoonCell.setAttribute('data-date', dates[i].toISOString().split('T')[0]);
            }
        }
    }

    // 获取当前选择的周的日期范围
    function getSelectedWeek() {
        // 获取当前显示的周的周一和周日

            // 使用当前显示的周
            return {
                startDate: window.currentWeekStart.toISOString().split('T')[0],
                endDate: window.currentWeekEnd.toISOString().split('T')[0]
            };
        } else {
            // 如果没有当前周信息，则使用当前周
            const today = new Date();
            const currentMonday = getMonday(today);

            const monday = new Date(currentMonday);
            const sunday = new Date(currentMonday);
            sunday.setDate(sunday.getDate() + 6);

            return {
                startDate: monday.toISOString().split('T')[0],
                endDate: sunday.toISOString().split('T')[0]
            };
        }
    }

    // 获取给定日期所在周的周一
    function getMonday(date) {
        const day = date.getDay();
        const diff = date.getDate() - day + (day === 0 ? -6 : 1); // 调整为周一
        return new Date(date.setDate(diff));
    }

    // 获取当前周的开始日期（周一）
    function getCurrentWeekStart() {
        return getMonday(new Date());
    }

    // 检查两个日期是否在同一周
    function isSameWeek(date1, date2) {
        if (!date1 || !date2) return false;

        const week1Start = getMonday(new Date(date1));
        const week2Start = getMonday(new Date(date2));

        return week1Start.getFullYear() === week2Start.getFullYear() &&
            week1Start.getMonth() === week2Start.getMonth() &&
            week1Start.getDate() === week2Start.getDate();
    }

    // 加载年份选项
    function loadYears() {
        const yearSelect = document.getElementById('yearSelector');
        if (!yearSelect) return;

        const currentYear = new Date().getFullYear();

        // 清空现有选项
        yearSelect.innerHTML = '';

        for (let i = currentYear - 10; i <= currentYear + 10; i++) {
            const option = document.createElement('option');
            option.value = i;
            option.textContent = i;
            if (i === currentYear) {
                option.selected = true;
            }
            yearSelect.appendChild(option);
        }
    }

    // 生成月历
    function generateCalendar() {
        const calendarGrid = document.getElementById('calendarGrid');
        if (!calendarGrid) return;

        const year = parseInt(document.getElementById('yearSelector').value);
        const month = parseInt(document.getElementById('monthSelector').value);

        // 清空现有内容
        calendarGrid.innerHTML = '';

        // 添加星期标题
        const weekdays = ['一', '二', '三', '四', '五', '六', '日'];
        weekdays.forEach(day => {
            const dayElement = document.createElement('div');
            dayElement.className = 'calendar-day fw-bold';
            dayElement.textContent = day;
            calendarGrid.appendChild(dayElement);
        });

        // 获取当月第一天
        const firstDay = new Date(year, month - 1, 1);
        // 获取当月最后一天
        const lastDay = new Date(year, month, 0);

        // 获取当月第一天是星期几 (0是周日，1是周一...6是周六)
        const firstDayOfWeek = firstDay.getDay();

        // 计算日历开始日期（当月第一周的周一）
        // 如果第一天是周日(0)，则需要回退6天到周一
        // 如果第一天是周X(1-6)，则需要回退(X-1)天到周一
        const startDayOffset = firstDayOfWeek === 0 ? 6 : firstDayOfWeek - 1;
        const startDate = new Date(year, month - 1, 1 - startDayOffset);

        // 生成日历天数
        const today = new Date();

        for (let i = 0; i < 42; i++) { // 最多6行7列
            const currentDate = new Date(year, month - 1, 1 - startDayOffset + i); // 使用构造函数直接创建正确日期

            const dayElement = document.createElement('div');
            dayElement.className = 'calendar-day';
            dayElement.textContent = currentDate.getDate();

            // 检查是否是今天
            if (currentDate.toDateString() === today.toDateString()) {
                dayElement.classList.add('today');
            }

            // 检查是否是当前月份
            if (currentDate.getMonth() + 1 === month) {
                dayElement.classList.add('current-month');
            } else {
                dayElement.classList.add('other-month');
                dayElement.style.color = '#ccc';
            }

            // 保存当前日期的副本，避免闭包问题
            const dateCopy = new Date(currentDate);

            dayElement.addEventListener('click', function (e) {
                // 阻止事件冒泡，防止下拉菜单关闭
                e.stopPropagation();

                // 检查是否是当前月份的日期
                if (dateCopy.getMonth() + 1 !== month) {
                    // 如果不是当前月份的日期，不执行选择操作
                    return;
                }

                // 移除之前选中的日期样式
                document.querySelectorAll('.calendar-day.selected').forEach(day => {
                    day.classList.remove('selected');
                });

                // 添加选中样式到当前日期
                this.classList.add('selected');

                // 保存选中的日期到全局变量
                window.selectedDate = dateCopy;
            });

            calendarGrid.appendChild(dayElement);
        }
    }

    // 选择指定日期所在的周
    function selectWeekForDate(date) {
        // 计算该日期所在周的周一
        const weekStart = new Date(date);
        const dayOfWeek = weekStart.getDay();
        const diffToMonday = weekStart.getDate() - dayOfWeek + (dayOfWeek === 0 ? -6 : 1);
        weekStart.setDate(diffToMonday);

        window.currentWeekStart = new Date(weekStart);
        window.currentWeekEnd = new Date(weekStart);
        window.currentWeekEnd.setDate(window.currentWeekEnd.getDate() + 6);

        // 更新周次选择按钮文本
        const weekBtn = document.getElementById('weekSelectorBtn');
        if (weekBtn) {
            weekBtn.textContent =
                `${weekStart.getFullYear()}年${weekStart.getMonth() + 1}月${weekStart.getDate()}日-${window.currentWeekEnd.getDate()}日`;
        }

        // 关闭下拉菜单
        const dropdownMenu = document.querySelector('#weekSelectorBtn + .dropdown-menu');
        if (dropdownMenu) {
            dropdownMenu.classList.remove('show');

            // 同时确保按钮的aria-expanded属性正确设置
            const weekSelectorBtn = document.getElementById('weekSelectorBtn');
            if (weekSelectorBtn) {
                weekSelectorBtn.setAttribute('aria-expanded', 'false');
            }
        }

        // 更新月份标题，同时显示年份和月份
        const monthElement = document.getElementById('current-month');
        if (monthElement) {
            monthElement.textContent = `${weekStart.getMonth() + 1}月`;
        }

        // 更新表头日期
        updateWeekDates(window.currentWeekStart);

        // 更新单元格样式
        updateScheduleCells(window.currentWeekStart);

        // 重新加载排班数据而不重新加载整个页面
        reloadScheduleData();
    }

                                date = new Date(schedule.scheduleDate);

                            // 确保日期是纯日期格式，不包含时间部分
                            const dateOnly = new Date(date.getFullYear(), date.getMonth(), date.getDate());

                            if (dateOnly >= weekStart && dateOnly <= weekEnd) {
                                console.log('日期匹配，处理单元格');

                                let colIndex;
                                if (dayOfWeek === 0) {
                                    colIndex = 7; // 周日放在最后
                                } else {
                                    colIndex = dayOfWeek; // 周一为1，依此类推
                                }

                                // 确定行索引（根据时段）
                                let rowIndex;
                                if (schedule.timeSlot === '上午') {
                                    rowIndex = 0;
                                } else if (schedule.timeSlot === '下午') {
                                    rowIndex = 1;
                                } else {
                                    rowIndex = 0; // 默认上午
                                }

                                // 计算表格单元格的ID
                                const dayNames = ['', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun']; // 索引0不使用
                                const dayName = dayNames[colIndex];

                                let cellId;
                                if (rowIndex === 0) {
                                    cellId = dayName + '-morning';
                                } else {
                                    cellId = dayName + '-afternoon';

                                            if (scheduleDate < new Date(today.getFullYear(), today.getMonth(), today.getDate())) {

                            }

                }
            })
            .catch(error => {
                console.error('加载排班信息时出错:', error);
            });
    }

    // 初始化当前周
    function initializeCurrentWeek() {
        const today = new Date();
        const dayOfWeek = today.getDay();
        const diffToMonday = today.getDate() - dayOfWeek + (dayOfWeek === 0 ? -6 : 1);
        const monday = new Date(today);
        monday.setDate(diffToMonday);

        window.currentWeekStart = new Date(monday);
        window.currentWeekEnd = new Date(monday);
        window.currentWeekEnd.setDate(window.currentWeekEnd.getDate() + 6);

        // 更新周次选择按钮文本
        const weekBtn = document.getElementById('weekSelectorBtn');
        if (weekBtn) {
            weekBtn.textContent =
                `${window.currentWeekStart.getFullYear()}年${window.currentWeekStart.getMonth() + 1}月${window.currentWeekStart.getDate()}日-${window.currentWeekEnd.getDate()}日`;
        }
    }

    // 更新周表头日期
    function updateWeekDates(startDate) {
        const days = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];

        for (let i = 0; i < 7; i++) {
            const date = new Date(startDate);
            date.setDate(startDate.getDate() + i);

            const dayElement = document.getElementById(`date-${days[i]}`);
            if (dayElement) {
                dayElement.textContent = `${date.getDate()}日`;
            }

            // 更新每个单元格的data-date属性
            const morningCell = document.getElementById(days[i] + '-morning');
            const afternoonCell = document.getElementById(days[i] + '-afternoon');

            if (morningCell) {
                morningCell.setAttribute('data-date', date.toISOString().split('T')[0]);
            }
            if (afternoonCell) {
                afternoonCell.setAttribute('data-date', date.toISOString().split('T')[0]);
            }
        }
    }

    // 更新周矩阵单元格的日期和样式
    function updateScheduleCells(startDate) {
        const currentTime = new Date();

        // 获取所有上午和下午的单元格
        const morningCells = document.querySelectorAll('[id$="-morning"]');
        const afternoonCells = document.querySelectorAll('[id$="-afternoon"]');

        for (let i = 0; i < 7; i++) {
            const date = new Date(startDate);
            date.setDate(startDate.getDate() + i);

            // 格式化日期为字符串
            const dateStr = date.toISOString().split('T')[0];

            // 更新上午单元格
            if (morningCells[i]) {
                morningCells[i].dataset.date = dateStr;
                // 检查是否是过去日期或今天上午超过12点
                if (isPastDate(date, '上午', currentTime)) {
                    morningCells[i].classList.add('past');
                    morningCells[i].style.backgroundColor = '#e9ecef';
                    morningCells[i].style.color = '#6c757d';
                } else {
                    morningCells[i].classList.remove('past');
                    morningCells[i].style.backgroundColor = '';
                    morningCells[i].style.color = '';
                }
            }

            // 更新下午单元格
            if (afternoonCells[i]) {
                afternoonCells[i].dataset.date = dateStr;
                // 检查是否是过去日期
                if (isPastDate(date, '下午', currentTime)) {
                    afternoonCells[i].classList.add('past');
                    afternoonCells[i].style.backgroundColor = '#e9ecef';
                    afternoonCells[i].style.color = '#6c757d';
                } else {
                    afternoonCells[i].classList.remove('past');
                    afternoonCells[i].style.backgroundColor = '';
                    afternoonCells[i].style.color = '';
                }
            }
        }
    }

    // 检查日期是否为过去日期
    function isPastDate(date, timeSlot, currentTime) {
        // 比较日期部分
        const dateOnly = new Date(date.getFullYear(), date.getMonth(), date.getDate());
        const currentOnly = new Date(currentTime.getFullYear(), currentTime.getMonth(), currentTime.getDate());

        // 如果是过去的日期，则为过去时间
        if (dateOnly < currentOnly) {
            return true;
        }

        // 如果是今天，检查时间段
        if (dateOnly.getTime() === currentOnly.getTime()) {
            if (timeSlot === '上午' && currentTime.getHours() >= 12) {
                return true; // 上午时段已过
            }
        }

        return false;
    }

    /**
     * 手动执行容器中的 script 标签
     * @param {HTMLElement} container - 包含脚本的容器元素
     */
    function executeScripts(container) {
        // 查找容器内所有的 script 标签
        const scripts = container.querySelectorAll('script');

        scripts.forEach(oldScript => {
            // 创建一个新的 script 元素
            const newScript = document.createElement('script');

            // 1. 复制所有属性
            Array.from(oldScript.attributes).forEach(attr => {
                newScript.setAttribute(attr.name, attr.value);
            });

            // 2. 复制脚本内容
            newScript.textContent = oldScript.textContent;

            // 3. 用新脚本替换旧脚本
            oldScript.parentNode.replaceChild(newScript, oldScript);
        });
    }

    // AJAX加载内容 - 最终修复版
    function loadContent(url, title) {
        const mainContent = document.getElementById('mainContent');

        // 显示加载中提示
        mainContent.innerHTML = '<div class="text-center p-5"><div class="spinner-border text-primary" role="status"></div><p class="mt-2 text-muted">加载中...</p></div>';

        // 1. 添加时间戳防止缓存 (?t=...)
        const fetchUrl = url + (url.includes('?') ? '&' : '?') + 't=' + new Date().getTime();

        fetch(fetchUrl)
            .then(response => {
                if (!response.ok) throw new Error('网络响应异常');
                return response.text();
            })
            .then(html => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');

                let finalHtml = '';

                // 2. 【关键修改】减少匹配规则，防止遗漏兄弟元素
                // 只有当页面明确指定了 #main-content 或 .main-content 时才精确提取
                // 否则直接提取整个 body，确保 modal 和 script 不丢失
                const contentSelector = doc.querySelector('#main-content') || doc.querySelector('.main-content');

                if (contentSelector) {
                    // 清理可能残留的导航栏
                    const sidebar = contentSelector.querySelector('.sidebar');
                    if (sidebar) sidebar.remove();
                    finalHtml = contentSelector.innerHTML;
                } else {
                    // 兜底方案：提取 body 中的所有内容
                    // 先移除 sidebar 防止重复
                    const sidebar = doc.querySelector('.sidebar');
                    if (sidebar) sidebar.remove();
                    finalHtml = doc.body.innerHTML;
                }

                // 3. 渲染 HTML
                mainContent.innerHTML = finalHtml;

                // 4. 强制执行新页面中的脚本
                const scripts = mainContent.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    Array.from(oldScript.attributes).forEach(attr => {
                        newScript.setAttribute(attr.name, attr.value);
                    });
                    newScript.textContent = oldScript.textContent;
                    document.body.appendChild(newScript);
                });

                // 5. 页面特定初始化逻辑
                // 检查报告页面
                if (url.includes('examinations')) {
                    console.log('检测到检查报告页面，正在等待脚本初始化...');
                    let checkCount = 0;
                    const checkInterval = setInterval(() => {
                        // 检查 window 对象上是否挂载了函数
                        if (typeof window.initExaminations === 'function') {
                            clearInterval(checkInterval);
                            console.log('initExaminations 函数已就绪，开始执行');
                            window.initExaminations();
                        } else {
                            checkCount++;
                            if (checkCount > 20) { // 1秒超时
                                clearInterval(checkInterval);
                                console.error('超时：未找到 initExaminations。请检查 HTML 结构是否完整（script标签是否被正确加载）。');
                            }
                        }
                    }, 50);
                }

                // 病历页面
                if (url.includes('medical-records') || url.includes('medical-records-view')) {
                    setTimeout(() => {
                        if (typeof loadMedicalRecords === 'function') {
                            loadMedicalRecords();
                        }
                    }, 100);
                }

            })
            .catch(error => {
                console.error('加载失败:', error);
                mainContent.innerHTML = `
            <div class="error-alert" style="background: linear-gradient(135deg, #FFE6E6 0%, #FFF0F0 100%); border-left: 5px solid #DC3545; border-radius: 8px; padding: 30px; margin: 20px;">
                <h3 style="color: #DC3545; font-size: 22px; font-weight: 600; margin-bottom: 15px;">加载失败</h3>
                <p style="color: #6B7280; font-size: 14px; line-height: 1.6;">抱歉，载入内容时发生错误，请稍后再试。</p>
            </div>
        `;
            });
    }


    /**
     * 打开编辑模态框并回显数据
     */
    function openEditModal(id, patientName, visitDate) {
        // 1. 设置基础只读信息
        document.getElementById('editRecordId').value = id;
        document.getElementById('editPatientName').value = patientName;
        document.getElementById('editVisitDate').value = visitDate;

        // 2. 先请求详情接口获取完整数据 (复用之前的详情接口)
        fetch(`/doctor/api/medical-records/${id}`)
            .then(res => res.json())
            .then(data => {
                // 3. 回显数据到输入框 (如果是 null 则显示空字符串)
                document.getElementById('editDiagnosis').value = data.diagnosis || '';
                document.getElementById('editChiefComplaint').value = data.chiefComplaint || '';
                document.getElementById('editPresentIllness').value = data.presentIllness || '';
                document.getElementById('editPastIllness').value = data.pastIllness || '';
                document.getElementById('editPhysicalExam').value = data.physicalExamination || '';
                document.getElementById('editAuxiliaryExam').value = data.auxiliaryExamination || '';
                document.getElementById('editTreatmentPlan').value = data.treatmentPlan || '';

                // 4. 显示模态框
                const modal = new bootstrap.Modal(document.getElementById('recordEditModal'));
                modal.show();
            })
            .catch(err => {
                console.error(err);
                alert('获取数据失败，无法进行编辑');
            });
    }

    const statsData = /*[[${stats}]]*/ {};

    // 2. 页面加载完成后的统一入口
    document.addEventListener('DOMContentLoaded', function() {
        // 初始化周次选择 (保留原有逻辑)
        if (typeof initializeWeekSelection === 'function') {
            initializeWeekSelection();
        }

        // 初始化年龄图表 (新增逻辑)
        initAgeChart();
    });

    // 3. 图表初始化函数
    function initAgeChart() {
        const chartCanvas = document.getElementById('ageDistributionChart');

        // 调试：打印 statsData
        console.log('statsData:', statsData);
        console.log('statsData.ageDistribution:', statsData ? statsData.ageDistribution : 'statsData is null');

        // 如果调试信息元素存在，显示数据
        const debugInfo = document.getElementById('debugInfo');
        const statsDataElement = document.getElementById('statsData');
        if (debugInfo && statsDataElement) {
            debugInfo.style.display = 'block';
            statsDataElement.textContent = JSON.stringify(statsData, null, 2);
        }

        // 防止页面上没有这个元素导致报错
        if (!chartCanvas) {
            console.warn('找不到 ageDistributionChart 画布元素，跳过图表初始化');
            return;
        }

        const ctx = chartCanvas.getContext('2d');

        // 确保 ageDistribution 存在且有数据
        let ageMap = {};

        // 尝试从多个可能的位置获取数据
        if (statsData && statsData.ageDistribution && typeof statsData.ageDistribution === 'object') {
            ageMap = statsData.ageDistribution;
        } else if (window.stats && window.stats.ageDistribution) {
            ageMap = window.stats.ageDistribution;
        } else {
            // 如果都失败，使用默认数据
            console.warn('无法获取年龄分布数据，使用默认数据');
            ageMap = {
                "0-18岁": 0,
                "19-35岁": 0,
                "36-50岁": 0,
                "51-65岁": 0,
                "65岁以上": 0
            };
        }

        // 确保所有年龄段都有值
        const requiredGroups = ["0-18岁", "19-35岁", "36-50岁", "51-65岁", "65岁以上"];
        requiredGroups.forEach(group => {
            if (ageMap[group] === undefined) {
                ageMap[group] = 0;
            }
        });

        const labels = Object.keys(ageMap);
        const dataValues = Object.values(ageMap);

        console.log('图表数据 - 标签:', labels);
        console.log('图表数据 - 值:', dataValues);

        // 销毁已存在的图表实例
        if (window.ageChart instanceof Chart) {
            window.ageChart.destroy();
        }

        // 创建新图表
        window.ageChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: '患者人数',
                    data: dataValues,
                    backgroundColor: [
                        'rgba(54, 162, 235, 0.6)',
                        'rgba(75, 192, 192, 0.6)',
                        'rgba(255, 206, 86, 0.6)',
                        'rgba(153, 102, 255, 0.6)',
                        'rgba(255, 99, 132, 0.6)'
                    ],
                    borderColor: [
                        'rgba(54, 162, 235, 1)',
                        'rgba(75, 192, 192, 1)',
                        'rgba(255, 206, 86, 1)',
                        'rgba(153, 102, 255, 1)',
                        'rgba(255, 99, 132, 1)'
                    ],
                    borderWidth: 1,
                    barPercentage: 0.6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: '人数'
                        },
                        ticks: {
                            stepSize: 1
                        }
                    },
                    x: {
                        ticks: {
                            maxRotation: 0
                        }
                    }
                },
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return context.raw + ' 人';
                            }
                        }
                    }
                }
            }
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        console.log('DOM 加载完成，开始初始化图表...');

        // 延迟一点时间确保所有数据加载完成
        setTimeout(() => {
            initAgeChart();
        }, 500);
    });
</script>
