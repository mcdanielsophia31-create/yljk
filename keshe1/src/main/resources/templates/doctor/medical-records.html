    <script th:inline="none">
        // XSS 防护工具函数
        function escapeHtml(text) {
            if (!text) return '';
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // 辅助函数：设置文本，如果为空则显示"无"
        function setText(elementId, value) {
            const el = document.getElementById(elementId);
            if (el) {
                el.textContent = value || '无';
            }
        }

        // 格式化治疗方案（将JSON转换为易读文本）
        function formatTreatmentPlan(treatmentPlan) {
            if (!treatmentPlan || treatmentPlan.trim() === '') {
                return '无';
            }

            // 新增：检查是否是空数组 JSON
            if (treatmentPlan.trim() === '[]' || treatmentPlan.trim() === '[]\n') {
                return '无';
            }

            try {
                // 尝试解析JSON
                const data = JSON.parse(treatmentPlan);

                // 新增：如果是空数组，返回"无"
                if (Array.isArray(data) && data.length === 0) {
                    return '无';
                }

                if (Array.isArray(data) && data.length > 0) {
                    let formattedText = '';

                    data.forEach((item, index) => {
                        formattedText += `${index + 1}. ${item.medicineName || '未知药品'}`;

                        if (item.genericName) {
                            formattedText += ` (${item.genericName})`;
                        }

                        if (item.specification) {
                            formattedText += `，规格：${item.specification}`;
                        }

                        if (item.frequency) {
                            formattedText += `，用法：${item.frequency}`;
                        }

                        if (item.quantity) {
                            formattedText += `，每次${item.quantity}${item.dosageUnit || ''}`;
                        }

                        // 新增：显示开药数量和服用天数
                        if (item.totalQuantity) {
                            formattedText += `，开药：${item.totalQuantity}盒`;
                        }

                        if (item.days) {
                            formattedText += `，服用${item.days}天`;
                        }

                        formattedText += '\n';
                    });

                    return formattedText.trim();
                }

                // 如果不是数组，直接返回
                return treatmentPlan;
            } catch (error) {
                // 如果不是JSON格式，直接返回原始文本
                return treatmentPlan;
            }
        }


        /**
         *  加载病历列表 (主入口)
         */
        window.loadMedicalRecords = function () {
            console.log("开始加载病历数据...");

            const tableBody = document.getElementById('medicalRecordsTableBody');
            const alertBox = document.getElementById('noRecordsAlert');
            const tableContainer = document.getElementById('recordsTableContainer');

            if (!tableBody) return;

            // 显示加载状态
            tableBody.innerHTML = '<tr><td colspan="6" class="text-center py-5"><div class="spinner-border text-primary"></div></td></tr>';
            if (alertBox) alertBox.classList.add('d-none');
            if (tableContainer) tableContainer.classList.remove('d-none');

            fetch('/doctor/api/medical-records')
                .then(res => {
                    if (!res.ok) throw new Error('网络请求失败');
                    return res.json();
                })
                .then(data => window.renderMedicalRecordsTable(data))
                .catch(err => {
                    console.error(err);
                    tableBody.innerHTML = '<tr><td colspan="6" class="text-center text-danger">数据加载失败</td></tr>';
                });
        };

        /**
         * 渲染表格
         */
        window.renderMedicalRecordsTable = function (records) {
            const tableBody = document.getElementById('medicalRecordsTableBody');
            if (!records || records.length === 0) {
                document.getElementById('recordsTableContainer').classList.add('d-none');
                document.getElementById('noRecordsAlert').classList.remove('d-none');
                return;
            }

            document.getElementById('recordsTableContainer').classList.remove('d-none');
            document.getElementById('noRecordsAlert').classList.add('d-none');

            tableBody.innerHTML = records.map(record => {
                // 处理可能包含单引号的名字，防止破坏 HTML 结构
                const safeName = (record.patientName || '').replace(/'/g, "\\'");
                const safeDate = (record.visitDate || '').replace(/'/g, "\\'");
                const recordId = record.recordId || record.id;

                return `
        <tr>
            <td>#${recordId}</td>
            <td>${escapeHtml(record.patientName)}</td>
            <td>${escapeHtml(record.doctorName)} <br><small class="text-muted">${escapeHtml(record.departmentName)}</small></td>
            <td>${escapeHtml(record.diagnosis)}</td>
            <td>${escapeHtml(record.visitDate)}</td>
            <td>
                <button class="btn btn-sm btn-outline-primary" onclick="window.viewRecordDetail(${recordId})">
                    <i class="fas fa-eye"></i> 查看
                </button>
            </td>
        </tr>
    `}).join('');
        };

        // 打开创建病历模态框
        window.openCreateRecordModal = function() {
            console.log("打开创建病历模态框");

            // 清空选择
            document.getElementById('patientSelect').innerHTML = '<option value="">-- 请选择患者 --</option>';

            // 显示加载状态en
            const select = document.getElementById('patientSelect');
            const loadingOption = document.createElement('option');
            loadingOption.value = '';
            loadingOption.textContent = '加载患者列表中...';
            select.appendChild(loadingOption);

            // 加载患者列表
            fetch('/doctor/api/patients/list')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('加载患者列表失败');
                    }
                    return response.json();
                })
                .then(patients => {
                    // 清空选择框
                    select.innerHTML = '<option value="">-- 请选择患者 --</option>';

                    if (!patients || patients.length === 0) {
                        const noPatientOption = document.createElement('option');
                        noPatientOption.value = '';
                        noPatientOption.textContent = '暂无患者数据';
                        select.appendChild(noPatientOption);
                        return;
                    }

                    // 添加患者选项
                    patients.forEach(patient => {
                        const option = document.createElement('option');
                        option.value = patient.id;

                        // 显示患者姓名（如果有的话）
                        const displayName = patient.patientName
                            ? `${patient.patientName} (ID: ${patient.id})`
                            : `患者ID: ${patient.id}`;

                        option.textContent = displayName;
                        option.setAttribute('data-patient-name', patient.patientName || '');
                        select.appendChild(option);
                    });

                    // 显示模态框
                    new bootstrap.Modal(document.getElementById('createRecordModal')).show();
                })
                .catch(error => {
                    console.error('加载患者列表失败:', error);
                    select.innerHTML = '<option value="">加载失败，请重试</option>';

                    // 仍然显示模态框
                    new bootstrap.Modal(document.getElementById('createRecordModal')).show();
                });
        };

        // 创建新病历
        function createNewMedicalRecord() {
            const patientSelect = document.getElementById('patientSelect');
            const patientId = patientSelect.value;

            if (!patientId) {
                alert('请选择患者');
                return;
            }

            // 显示加载状态
            const createBtn = document.querySelector('#createRecordModal .btn-success');
            const originalText = createBtn.innerHTML;
            createBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>创建中...';
            createBtn.disabled = true;

            // 发送创建请求
            fetch('/doctor/api/medical-records/create', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    patientId: parseInt(patientId)
                })
            })
                .then(response => response.json())
                .then(data => {
                    // 恢复按钮状态
                    createBtn.innerHTML = originalText;
                    createBtn.disabled = false;

                    if (data.success) {
                        // 关闭创建模态框
                        const createModal = bootstrap.Modal.getInstance(document.getElementById('createRecordModal'));
                        if (createModal) {
                            createModal.hide();
                        }

                        // 获取患者姓名用于显示
                        const selectedOption = patientSelect.options[patientSelect.selectedIndex];
                        const patientName = selectedOption.getAttribute('data-patient-name') || '';

                        // 打开编辑模态框（使用新创建的病历ID）
                        window.openEditModal(
                            data.recordId,
                            patientName,
                            new Date().toISOString().split('T')[0] // 当前日期作为就诊日期
                        );

                        // 刷新病历列表（可选）
                        setTimeout(() => {
                            window.loadMedicalRecords();
                        }, 1000);

                    } else {
                        alert('创建失败: ' + (data.message || '未知错误'));
                    }
                })
                .catch(error => {a
                    console.error('创建病历失败:', error);
                    createBtn.innerHTML = originalText;
                    createBtn.disabled = false;
                    alert('创建失败，请检查网络连接');
                });
        }

        /**
         * 查看病历详情
         * @param {number} id - 病历ID
         */
        window.viewRecordDetail = function (id) {
            // 1. 获取模态框实例
            const modalEl = document.getElementById('recordDetailModal');
            const modal = new bootstrap.Modal(modalEl);

            // 2. 显示模态框，并重置为加载状态
            document.getElementById('modalLoading').style.display = 'block';
            document.getElementById('modalContent').style.display = 'none';
            modal.show();

            // 3. 移除之前可能存在的费用详情部分
            const existingPriceSection = document.getElementById('priceDetailSection');
            if (existingPriceSection) {
                existingPriceSection.remove();
            }

            // 4. 请求后端数据获取病历详情
            fetch(`/doctor/api/medical-records/${id}`)
                .then(response => {
                    if (!response.ok) throw new Error('获取详情失败');
                    return response.json();
                })
                .then(data => {
                    // 5. 填充数据 (使用辅助函数处理空值)
                    setText('detailVisitDate', data.visitDate);
                    setText('detailDiagnosis', data.diagnosis);

                    setText('detailChiefComplaint', data.chiefComplaint);
                    setText('detailPresentIllness', data.presentIllness);
                    setText('detailPastIllness', data.pastIllness);
                    setText('detailPhysicalExam', data.physicalExamination);
                    setText('detailAuxiliaryExam', data.auxiliaryExamination);

                    // 治疗方案特殊处理：格式化为文本
                    const plan = data.treatmentPlan ? formatTreatmentPlan(data.treatmentPlan).replace(/\n/g, '<br>') : '无';
                    document.getElementById('detailTreatmentPlan').innerHTML = plan;

                    // 6. 切换显示状态
                    document.getElementById('modalLoading').style.display = 'none';

        /**
         * 打开开药页面
         */
        window.openPrescriptionPage = function() {
            // 1. 获取当前病历ID
            const recordId = document.getElementById('editRecordId').value;
            if (!recordId) {
                alert('请先创建或选择一份病历后再进行开药操作');
                return;
            }

            // 2. 收集当前医生已经填写、但还未手动点击“保存修改”的文字信息
            const currentRecordData = {
                id: recordId,
                diagnosis: document.getElementById('editDiagnosis').value,
                chiefComplaint: document.getElementById('editChiefComplaint').value,
                presentIllness: document.getElementById('editPresentIllness').value,
                pastIllness: document.getElementById('editPastIllness').value,
                physicalExamination: document.getElementById('editPhysicalExam').value,
                auxiliaryExamination: document.getElementById('editAuxiliaryExam').value
            };

            // 3. 在跳转前自动发起一次无感保存
            fetch('/doctor/api/medical-records/update', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(currentRecordData)
            })
                .then(response => {
                    if (response.ok) {
                        console.log('跳转前自动保存文本成功');
                        // 4. 自动保存成功后，再安全地打开新标签页去开药
                        window.open('/doctor/prescription/' + recordId, '_blank');
                    } else {
                        // 如果自动保存失败，提示医生，防止数据丢失
                        if (confirm('暂存当前病历文本失败，是否仍要跳转到开药页面？(可能会丢失当前填写的文字)')) {
                            window.open('/doctor/prescription/' + recordId, '_blank');
                        }
                    }
                })
                .catch(error => {
                    console.error('自动保存出错:', error);
                    if (confirm('网络错误，暂存文本失败。是否仍要继续去开药？')) {
                        window.open('/doctor/prescription/' + recordId, '_blank');
                    }
                });
        };

        /**
         * 开药页面保存后，跨窗口无感局部同步函数
         * 作用：不刷新页面，只更新当前编辑模态框里的“治疗方案”文本框，并刷新底层列表数据
         * @param {number} recordId - 当前病历ID
         */
        window.syncTreatmentPlanFromPrescription = function(recordId) {
            console.log("收到处方页保存成功的信号，开始无感局部同步，病历ID:", recordId);

            // 1. 如果医生已经把编辑模态框关闭了，则无需同步文本框
            const currentEditId = document.getElementById('editRecordId') ? document.getElementById('editRecordId').value : null;

            if (currentEditId && String(currentEditId) === String(recordId)) {
                // 2. 发起异步请求，只获取这份病历的最新治疗方案数据
                fetch('/doctor/api/medical-records/' + recordId)
                    .then(response => {
                        if (!response.ok) throw new Error('网络请求异常');
                        return response.json();
                    })
                    .then(data => {
                        if (data && data.treatmentPlan) {
                            const treatmentPlanTextarea = document.getElementById('editTreatmentPlan');
                            if (treatmentPlanTextarea) {
                                // 3. 仅仅精准覆盖“治疗方案”这一个文本框，医生正在输入的现病史、主诉等完全不受影响
                                treatmentPlanTextarea.value = formatTreatmentPlan(data.treatmentPlan);
                                console.log("治疗方案文本框局部同步成功！");
                            }
                        }
                    })
                    .catch(error => {
                        console.error('局部同步治疗方案文本失败:', error);
                    });
            }

            // 4. 静默局部刷新底层的病历列表表格，保证表格里的诊断结果等也是最新的
            if (typeof window.loadMedicalRecords === 'function') {
                // 由于你的主页面渲染列表是用 fetch 异步渲染的，直接调用它只刷新表格，不刷新网页
                fetch('/doctor/api/medical-records')
                    .then(res => res.json())
                    .then(data => window.renderMedicalRecordsTable(data))
                    .catch(err => console.error("静默刷新列表失败:", err));
            }
        };

        /**
         * 实现"修改"功能 (关键逻辑)
         * 功能：接收列表传递的基础信息 -> 填充模态框 -> 显示 -> (可选)后台获取更详细信息
         */
        window.openEditModal = function (id, patientName, visitDate) {
            console.log('正在打开编辑模态框，ID:', id);

            // 1. 获取模态框元素
            const modalEl = document.getElementById('recordEditModal');
            if (!modalEl) {
                alert('错误：找不到编辑模态框 (recordEditModal)');
                return;
            }

            // 2. 先清空旧数据
            const editForm = document.getElementById('editRecordForm');
            if (editForm) {
                editForm.reset();
            }

            // 3. 立即回显基础信息
            document.getElementById('editRecordId').value = id;

            // 如果传了名字，就填名字；没传则留空
            if (patientName) {
                document.getElementById('editPatientName').value = patientName;
            }
            if (visitDate) {
                document.getElementById('editVisitDate').value = visitDate;
            } else {
                // 如果没有传入就诊日期，使用今天
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('editVisitDate').value = today;
            }

            // 4. 显示模态框
            if (typeof bootstrap !== 'undefined') {
                const modalInstance = new bootstrap.Modal(modalEl);
                modalInstance.show();
            } else {
                alert('Bootstrap 未加载，无法显示模态框');
                return;
            }

            // 5. 请求后端获取该病历的完整详情
            // 如果是新创建的病历，后端可能返回空数据，这是正常的
            fetch('/doctor/api/medical-records/' + id)
                .then(response => {
                    if (!response.ok) {
                        // 对于新创建的病历，如果404，我们仍然继续
                        console.log('病历详情可能为空，继续使用默认值');
                        return null;
                    }
                    return response.json();
                })
                .then(data => {
                    if (data) {
                        // 如果后端有数据，用后端数据填充
                        if (data.patientName) {
                            document.getElementById('editPatientName').value = data.patientName;
                        }
                        if (data.visitDate) {
                            document.getElementById('editVisitDate').value = data.visitDate;
                        }

                        document.getElementById('editDiagnosis').value = data.diagnosis || '';
                        document.getElementById('editChiefComplaint').value = data.chiefComplaint || '';
                        document.getElementById('editPresentIllness').value = data.presentIllness || '';
                        document.getElementById('editPastIllness').value = data.pastIllness || '';
                        document.getElementById('editPhysicalExam').value = data.physicalExamination || '';
                        document.getElementById('editAuxiliaryExam').value = data.auxiliaryExamination || '';

                        // 治疗方案字段：格式化为文本显示
                        const treatmentPlan = data.treatmentPlan || '';
                        document.getElementById('editTreatmentPlan').value = formatTreatmentPlan(treatmentPlan);
                    }
                    // 如果没有数据（新病历），保持已设置的基础信息
                })
                .catch(error => {
                    console.error('获取详情失败（可能是新病历）:', error);
                    // 对于新创建的病历，获取详情失败是正常的
                });
        };

        /**
         * 保存修改
         */
        window.saveRecordChanges = function () {
            // 1. 收集表单数据
            const recordData = {
                id: document.getElementById('editRecordId').value,
                diagnosis: document.getElementById('editDiagnosis').value,
                chiefComplaint: document.getElementById('editChiefComplaint').value,
                presentIllness: document.getElementById('editPresentIllness').value,
                pastIllness: document.getElementById('editPastIllness').value,
                physicalExamination: document.getElementById('editPhysicalExam').value,
                auxiliaryExamination: document.getElementById('editAuxiliaryExam').value,
                // 注意：保存的是文本框中的文本内容
                treatmentPlan: document.getElementById('editTreatmentPlan').value
            };

            // 2. 发送 AJAX 请求
            fetch('/doctor/api/medical-records/update', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(recordData)
            })
                .then(response => {
                    if (response.ok) {
                        // 3. 成功逻辑
                        alert('保存成功！');

                        // 关闭模态框
                        const modalEl = document.getElementById('recordEditModal');
                        const modalInstance = bootstrap.Modal.getInstance(modalEl);
                        modalInstance.hide();

                        // 4. 局部刷新列表 (核心步骤)
                        window.loadMedicalRecords();
                    } else {
                        alert('保存失败，请重试。');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('网络错误，无法保存。');
                });
        };

        /**
         * 模糊查询
         */
        // 1. 防抖变量
        if (typeof searchTimeout === 'undefined') {
            var searchTimeout = null;
        }

        // 2. 核心搜索/加载函数 (绑定到输入框的 onkeyup)
        window.filterMedicalRecordsTable = function() {
            const input = document.getElementById("searchRecordInput");
            const keyword = input.value;

            // 清除之前的定时器 (防止输入过快发送多次请求)
            clearTimeout(searchTimeout);

            // 设置延时 300ms 后发送请求
            searchTimeout = setTimeout(() => {
                fetchMedicalRecords(keyword);
            }, 300);
        };

        // 3. 请求后端数据
        function fetchMedicalRecords(keyword = '') {
            fetch(`/doctor/api/medical-records?name=${encodeURIComponent(keyword)}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('网络响应异常');
                    }
                    // 关键点：必须先 return response.json() 传给下一个 .then
                    return response.json();
                })
                .then(data => {
                    // 此时 data 才有定义，调用同一个渲染函数
                    window.renderMedicalRecordsTable(data);
                })
                .catch(error => {
                    console.error('搜索出错:', error);
                    const tableBody = document.getElementById('medicalRecordsTableBody');
                    if (tableBody) {
                        tableBody.innerHTML = '<tr><td colspan="6" class="text-center text-danger">搜索失败</td></tr>';
                    }
                });
        }


        // 全局变量存储所有检查项目配置数据
        var allExamItems = [];
        var currentRecordExistingItemIds = [];

        // 打开开检查模态框
        window.openPrescribeModal = function() {
            // 获取当前正在编辑的 recordId
            const recordId = document.getElementById('editRecordId').value;
            if (!recordId) {
                alert("未找到病历ID");
                return;
            }

            // 并行请求：1. 所有检查项目列表 2. 当前病历已开的检查
            Promise.all([
                fetch('/doctor/api/examinations/items').then(res => res.json()),
                fetch(`/doctor/api/examinations/list?recordId=${recordId}`).then(res => res.json())
            ]).then(([allItems, existingExams]) => {
                allExamItems = allItems;

                // 提取已存在的项目ID
                currentRecordExistingItemIds = existingExams.map(ex => ex.examinationItemId);

                // 重置并显示模态框
                const container = document.getElementById('examItemsContainer');
                container.innerHTML = '';
                addExamRow(); // 添加第一行

                // 渲染已开立的检查项目列表
                renderExistingExams(existingExams);

                // 设置模态框隐藏时的回调，刷新辅助检查文本框
                const modalEl = document.getElementById('prescribeModal');
                modalEl.addEventListener('hidden.bs.modal', function() {
                    // 模态框关闭后，刷新编辑模态框中的辅助检查内容
                    fetch(`/doctor/api/medical-records/${recordId}`)
                        .then(r => r.json())
                        .then(data => {
                            document.getElementById('editAuxiliaryExam').value = data.auxiliaryExamination;
                        });
                });

                new bootstrap.Modal(modalEl).show();
            }).catch(err => {
                console.error("加载数据失败", err);
                alert("无法加载检查项目数据");
            });
        }

        // 添加一行
        function addExamRow() {
            const container = document.getElementById('examItemsContainer');
            const index = container.children.length;

            // 提取所有唯一的类型
            const types = [...new Set(allExamItems.map(item => item.examinationType))];
            let typeOptions = '<option value="">-- 选择检查类型 --</option>';
            types.forEach(t => {
                typeOptions += `<option value="${t}">${t}</option>`;
            });

            const rowHtml = `
            <div class="row g-2 mb-2 exam-row">
                <div class="col-md-5">
                    <select class="form-select type-select" onchange="handleTypeChange(this)">
                        ${typeOptions}
                    </select>
                </div>
                <div class="col-md-6">
                    <select class="form-select item-select" disabled>
                        <option value="">-- 先选择类型 --</option>
                    </select>
                </div>
                <div class="col-md-1 d-grid">
                    ${index > 0 ? `<button type="button" class="btn btn-outline-danger" onclick="this.closest('.row').remove()"><i class="fas fa-trash"></i></button>` : ''}
                </div>
            </div>
        `;
            container.insertAdjacentHTML('beforeend', rowHtml);
        }

        // 级联处理：类型改变 -> 更新项目下拉框
        function handleTypeChange(selectElement) {
            const type = selectElement.value;
            // 找到同一行的 item-select
            const row = selectElement.closest('.exam-row');
            const itemSelect = row.querySelector('.item-select');

            itemSelect.innerHTML = '<option value="">-- 请选择项目 --</option>';

            if (type) {
                // 筛选出该类型的项目
                const items = allExamItems.filter(item => item.examinationType === type);

                items.forEach(item => {
                    // 检查该项目是否已存在
                    const isPrescribed = currentRecordExistingItemIds.includes(item.id);

                    const option = document.createElement('option');
                    option.value = item.id;
                    // 如果已开，添加标记并禁用
                    if (isPrescribed) {
                        option.textContent = item.examinationItem + " (已开)";
                        option.disabled = true;
                    } else {
                        option.textContent = `${item.examinationItem} (￥${item.price});`;
                    }
                    itemSelect.appendChild(option);
                });
                itemSelect.disabled = false;
            } else {
                itemSelect.disabled = true;
            }
        }

        /// 提交开单
        function submitPrescription() {
            const itemSelects = document.querySelectorAll('#examItemsContainer .item-select');
            const selectedIds = [];

            itemSelects.forEach(select => {
                if (select.value) {
                    selectedIds.push(parseInt(select.value));
                }
            });

            // 获取当前正在编辑的病历ID
            const recordId = document.getElementById('editRecordId').value;

            fetch('/doctor/api/examinations/prescribe', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    recordId: recordId,
                    itemIds: selectedIds
                })
            })
                .then(res => {
                    if (res.ok) {
                        return res.text();
                    } else {
                        throw new Error('开单失败');
                    }
                })
                .then(message => {
                    alert(message);

                    // 关闭开单模态框
                    const modal = bootstrap.Modal.getInstance(document.getElementById('prescribeModal'));
                    if (modal) modal.hide();

                    // 强制重新加载病历数据，清空并重新上传
                    if (recordId) {
                        fetch(`/doctor/api/medical-records/${recordId}`)
                            .then(r => r.json())
                            .then(data => {
                                // 清空文本框然后重新设置
                                document.getElementById('editAuxiliaryExam').value = '';
                                // 短暂延迟确保清空生效
                                setTimeout(() => {
                                    document.getElementById('editAuxiliaryExam').value = data.auxiliaryExamination || '';
                                }, 10);
                            })
                            .catch(err => {
                                console.error('获取病历数据失败:', err);
                                document.getElementById('editAuxiliaryExam').value = '';
                            });
                    }

                    // 重新加载已开立的检查项目
                    loadExistingExams(recordId);
                    // 刷新下拉框中的项目状态
                    refreshExamSelects();
                })
                .catch(err => {
                    console.error("开单失败:", err);
                    alert(err.message || "网络错误，请稍后重试");
                });
        }

        // 渲染已开立的检查项目列表
        function renderExistingExams(exams) {
            const container = document.getElementById('existingExamsList');
            if (!container) return;

            if (!exams || exams.length === 0) {
                container.innerHTML = `
            <div class="text-center text-muted py-3">
                <i class="fas fa-inbox fa-lg me-2"></i>
                暂无已开立的检查项目
            </div>
        `;
                return;
            }

            let html = '';
            exams.forEach(exam => {
                const isCompleted = exam.status === '已完成';
                const badgeClass = isCompleted ? 'bg-success' : 'bg-warning text-dark';
                const badgeText = isCompleted ? '已完成' : '待完成';
                const disableDelete = isCompleted ? 'disabled' : '';
                const deleteTooltip = isCompleted ? 'title="已完成项目不可删除"' : '';

                html += `
            <div class="d-flex justify-content-between align-items-center p-2 border rounded bg-light">
                <div>
                    <span class="fw-bold">${exam.examinationItemName || '未知项目'}</span>
                    <span class="badge ${badgeClass} ms-2">${badgeText}</span>
                    ${exam.examinationResult ? `<div class="text-muted small mt-1">结果: ${exam.examinationResult}</div>` : ''}
                </div>
                <div>
                    <button class="btn btn-sm btn-outline-danger"
                            onclick="deleteExamItem(${exam.id})"
                            ${disableDelete}
                            ${deleteTooltip}>
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>
        `;
            });

            container.innerHTML = html;
        }

        // 删除检查项目
        function deleteExamItem(examId) {
            if (!confirm('确定要删除这个检查项目吗？')) {
                return;
            }

            fetch(`/doctor/api/examinations/${examId}`, {
                method: 'DELETE',
                headers: {'Content-Type': 'application/json'}
            })
                .then(res => {
                    if (res.ok) {
                        return res.text();
                    }
                    throw new Error('删除失败');
                })
                .then(message => {
                    alert(message);
                    // 重新加载已开立的检查项目
                    const recordId = document.getElementById('editRecordId').value;
                    loadExistingExams(recordId);
                    // 刷新下拉框中的项目状态
                    refreshExamSelects();
                })
                .catch(error => {
                    console.error("删除失败:", error);
                    alert(error.message || "删除失败");
                });
        }

        // 加载已开立的检查项目
        function loadExistingExams(recordId) {
            if (!recordId) return;

            fetch(`/doctor/api/examinations/list?recordId=${recordId}`)
                .then(res => res.json())
                .then(exams => {
                    // 存储已存在的项目ID，用于下拉框禁用
                    currentRecordExistingItemIds = exams.map(ex => ex.examinationItemId);
                    // 渲染已开立的检查项目列表
                    renderExistingExams(exams);
                })
                .catch(err => {
                    console.error("加载已开立检查项目失败:", err);
                    renderExistingExams([]);
                });
        }

        // 刷新检查项目下拉框（重新构建）
        function refreshExamSelects() {
            const typeSelects = document.querySelectorAll('#examItemsContainer .type-select');

            typeSelects.forEach(select => {
                const type = select.value;
                const row = select.closest('.exam-row');
                const itemSelect = row.querySelector('.item-select');

                // 如果已经选择了类型，则重新填充项目
                if (type) {
                    handleTypeChange(select);
                }
            });
        }

        // 修改 openPrescribeModal 函数，添加加载已开立检查项目的逻辑
        window.openPrescribeModal = function() {
            // 获取当前正在编辑的 recordId
            const recordId = document.getElementById('editRecordId').value;
            if (!recordId) {
                alert("未找到病历ID");
                return;
            }

            // 并行请求：1. 所有检查项目列表 2. 当前病历已开的检查
            Promise.all([
                fetch('/doctor/api/examinations/items').then(res => res.json()),
                fetch(`/doctor/api/examinations/list?recordId=${recordId}`).then(res => res.json())
            ]).then(([allItems, existingExams]) => {
                allExamItems = allItems;

                // 提取已存在的项目ID
                currentRecordExistingItemIds = existingExams.map(ex => ex.examinationItemId);

                // 重置并显示模态框
                const container = document.getElementById('examItemsContainer');
                container.innerHTML = '';
                addExamRow(); // 添加第一行

                // 渲染已开立的检查项目列表
                renderExistingExams(existingExams);

                new bootstrap.Modal(document.getElementById('prescribeModal')).show();
            }).catch(err => {
                console.error("加载数据失败", err);
                alert("无法加载检查项目数据");
            });
        }

        // 修改 handleTypeChange 函数，使用最新的 currentRecordExistingItemIds
        function handleTypeChange(selectElement) {
            const type = selectElement.value;
            // 找到同一行的 item-select
            const row = selectElement.closest('.exam-row');
            const itemSelect = row.querySelector('.item-select');

            itemSelect.innerHTML = '<option value="">-- 请选择项目 --</option>';

            if (type) {
                // 筛选出该类型的项目
                const items = allExamItems.filter(item => item.examinationType === type);

                items.forEach(item => {
                    // 检查该项目是否已存在（使用最新的 ID 列表）
                    const isPrescribed = currentRecordExistingItemIds.includes(item.id);

                    const option = document.createElement('option');
                    option.value = item.id;
                    // 如果已开，添加标记并禁用
                    if (isPrescribed) {
                        option.textContent = item.examinationItem + " (已开)";
                        option.disabled = true;
                    } else {
                        option.textContent = `${item.examinationItem} (￥${item.price});`;
                    }
                    itemSelect.appendChild(option);
                });
                itemSelect.disabled = false;
            } else {
                itemSelect.disabled = true;
            }
        }

        // 提交开单
        function submitPrescription() {
            const itemSelects = document.querySelectorAll('#examItemsContainer .item-select');
            const selectedIds = [];

            itemSelects.forEach(select => {
                if (select.value) {
                    selectedIds.push(parseInt(select.value));
                }
            });

            // 获取当前正在编辑的病历ID
            const recordId = document.getElementById('editRecordId').value;

            if (!recordId) {
                alert("未找到病历ID");
                return;
            }

            // 显示加载状态
            const submitBtn = document.querySelector('#prescribeModal .btn-success');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 处理中...';
            submitBtn.disabled = true;

            fetch('/doctor/api/examinations/prescribe', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    recordId: recordId,
                    itemIds: selectedIds
                })
            })
                .then(res => {
                    if (res.ok) {
                        return res.text();
                    } else {
                        throw new Error('开单失败');
                    }
                })
                .then(message => {
                    alert(message);

                    // 恢复按钮状态
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;

                    // 关闭开单模态框
                    const modal = bootstrap.Modal.getInstance(document.getElementById('prescribeModal'));
                    if (modal) modal.hide();

                    // 强制刷新辅助检查栏
                    forceRefreshAuxiliaryExam(recordId);

                    // 重新加载已开立的检查项目
                    loadExistingExams(recordId);
                    // 刷新下拉框中的项目状态
                    refreshExamSelects();
                })
                .catch(err => {
                    console.error("开单失败:", err);
                    alert(err.message || "网络错误，请稍后重试");
                    // 恢复按钮状态
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                });
        }

        // 强制刷新辅助检查栏
        function forceRefreshAuxiliaryExam(recordId) {
            if (!recordId) return;

            // 清空当前显示
            document.getElementById('editAuxiliaryExam').value = '';

            // 从后端获取最新数据
            fetch(`/doctor/api/medical-records/${recordId}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('获取数据失败');
                    }
                    return response.json();
                })
                .then(data => {
                    // 设置新的辅助检查内容
                    const auxiliaryExam = data.auxiliaryExamination || '';
                    document.getElementById('editAuxiliaryExam').value = auxiliaryExam;

                    // 如果为空，显示提示
                    if (!auxiliaryExam.trim()) {
                        console.log('辅助检查栏已清空');
                    }
                })
                .catch(error => {
                    console.error('强制刷新失败:', error);
                });
        }
    </script>
</div>
