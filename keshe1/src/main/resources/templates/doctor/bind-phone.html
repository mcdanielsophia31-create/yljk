<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绑定电话号码 - 医疗健康管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .sidebar {
            background: linear-gradient(135deg, #36B37E 0%, #00A3BF 100%);
            min-height: 100vh;
            color: white;
            position: fixed;
            width: 250px;
            padding-top: 20px;
            transition: all 0.3s;
            z-index: 100;
        }

        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.8);
            padding: 12px 20px;
            margin: 5px 15px;
            border-radius: 8px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
        }

        .sidebar .nav-link i {
            margin-right: 12px;
            width: 20px;
            text-align: center;
        }

        .sidebar .nav-link:hover {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .sidebar .nav-link.active {
            background: rgba(255, 255, 255, 0.25);
            color: white;
        }

        .sidebar-sticky {
            padding-top: 20px;
        }

        .main-content {
            margin-left: 250px;
            padding: 20px;
            transition: all 0.3s;
        }

        .page-header {
            background: linear-gradient(135deg, #36B37E 0%, #00A3BF 100%);
            color: white;
            padding: 30px 0;
            margin-bottom: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card {
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: none;
            margin-bottom: 20px;
        }

        .card-header {
            background: linear-gradient(135deg, #36B37E 0%, #00A3BF 100%);
            color: white;
            border-radius: 10px 10px 0 0 !important;
            font-weight: 600;
            padding: 15px 20px;
        }

        .form-control {
            border-radius: 8px;
            border: 2px solid #e9ecef;
            padding: 8px 12px;
        }

        .form-control:focus {
            border-color: #36B37E;
            box-shadow: 0 0 0 0.2rem rgba(54, 179, 126, 0.25);
        }

        .btn-primary {
            background: linear-gradient(135deg, #36B37E 0%, #00A3BF 100%);
            border: none;
            border-radius: 20px;
            padding: 8px 20px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .alert {
            border-radius: 8px;
        }

        .container {
            max-width: 800px;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                min-height: auto;
                position: relative;
            }
            
            .main-content {
                margin-left: 0;
            }
            
            .sidebar .nav-link {
                display: inline-block;
                margin: 2px 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- 侧边栏 -->
            <nav class="col-md-2 d-md-block sidebar">
                <div class="sidebar-sticky">
                    <h6 class="sidebar-heading d-flex justify-content-between align-items-center px-3 mt-4 mb-1 text-muted">
                        <span>医生功能</span>
                    </h6>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/doctor/dashboard}">
                                <i class="fas fa-home"></i> 仪表板
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/doctor/profile}">
                                <i class="fas fa-user"></i> 个人信息
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/doctor/patients}">
                                <i class="fas fa-users"></i> 患者管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/doctor/appointments}">
                                <i class="fas fa-calendar"></i> 预约管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/doctor/medical-records}">
                                <i class="fas fa-file-medical"></i> 病历管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/doctor/waiting-queue}">
                                <i class="fas fa-clock"></i> 候诊队列
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" th:href="@{/doctor/bind-phone}">
                                <i class="fas fa-phone"></i> 绑定电话
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- 主内容区 -->
            <main class="col-md-10 ml-sm-auto px-4 main-content">
                <div class="page-header">
                    <div class="container-fluid">
                        <h1 class="h2 mb-0">绑定电话号码</h1>
                        <p class="mb-0">管理您的联系方式</p>
                    </div>
                </div>

                <div class="container">
                    <div class="row justify-content-center">
                        <div class="col-md-6">
                            <div class="card">
                                <div class="card-header">
                                    <h3 class="text-center mb-0">绑定电话号码</h3>
                                </div>
                                <div class="card-body">
                                    <!-- 显示错误信息 -->
                                    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
                                    
                                    <!-- 绑定电话号码表单 -->
                                    <form action="/doctor/bind-phone" method="post">
                                        <div class="mb-3">
                                            <label for="phone" class="form-label">电话号码</label>
                                            <input type="tel" class="form-control" id="phone" name="phone" required>
                                        </div>
                                        <div class="mb-3">
                                            <label for="confirmPhone" class="form-label">确认电话号码</label>
                                            <input type="tel" class="form-control" id="confirmPhone" name="confirmPhone" required>
                                        </div>
                                        <div class="d-grid">
                                            <button type="submit" class="btn btn-primary">绑定</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 电话号码验证
        document.querySelector('form').addEventListener('submit', function(e) {
            const phone = document.getElementById('phone').value;
            const confirmPhone = document.getElementById('confirmPhone').value;
            
            if (phone !== confirmPhone) {
                e.preventDefault();
                alert('两次输入的电话号码不一致');
            }
            
            // 验证电话号码格式（11位数字）
            const phoneRegex = /^1[3-9]\d{9}$/;
            if (!phoneRegex.test(phone)) {
                e.preventDefault();
                alert('请输入正确的11位手机号码');
            }
        });
    </script>
</body>
</html>
