<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>预约管理 - 医生端</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            text-align: center;
            min-width: 70px;
        }

        .status-pending {
            background-color: #fff3cd;
            color: #856404;
        }

        .status-confirmed {
            background-color: #d4edda;
            color: #155724;
        }

        .status-cancelled {
            background-color: #f8d7da;
            color: #721c24;
        }

        .action-buttons .btn {
            margin-right: 5px;
            margin-bottom: 5px;
        }

        .card {
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px 10px 0 0 !important;
        }
    </style>
</head>
<body>
<!-- 医生端导航栏 -->
<nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
    <div class="container">
        <a class="navbar-brand" href="/doctor/dashboard">
            <i class="fas fa-hospital me-2"></i>医疗健康管理系统 - 医生端
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/doctor/dashboard">
                <i class="fas fa-home me-1"></i> 仪表板
            </a>
            <a class="nav-link" href="/logout">
                <i class="fas fa-sign-out-alt me-1"></i> 退出
            </a>
        </div>
    </div>
</nav>

<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <div class="d-flex justify-content-between align-items-center">
                        <h4 class="mb-0">预约管理</h4>
                        <div>
                            <a th:href="@{/doctor/dashboard}" class="btn btn-light btn-sm me-2">
                                <i class="fas fa-arrow-left"></i> 返回
                            </a>
                            <button class="btn btn-light btn-sm" onclick="refreshPage()">
                                <i class="fas fa-sync-alt"></i> 刷新
                            </button>
                        </div>
                    </div>
                </div>

                    <!-- 预约列表 -->
                    <div th:if="${appointments == null or appointments.isEmpty()}" class="alert alert-info text-center">
                        <i class="fas fa-calendar-times fa-2x mb-3"></i>
                        <h5>暂无预约记录</h5>
                        <p>当前没有预约记录，请稍后再查看</p>
                    </div>

                    <div class="table-responsive" th:if="${appointments != null and not appointments.isEmpty()}">
                        <table class="table table-striped table-hover">
                            <tr th:each="appointment : ${appointments}" th:attr="data-appointment-id=${appointment.id}">
                                <!-- 患者姓名 -->
                                <td th:text="${appointment.patientName}"></td>

                                <!-- 年龄 -->
                                <td th:text="${appointment.patientAge}"></td>

                                <!-- 性别 -->
                                <td th:text="${appointment.patientGender}"></td>

                                <!-- 预约日期 -->
                                <td th:text="${appointment.appointmentDate != null ? #temporals.format(appointment.appointmentDate, 'yyyy-MM-dd') : '无'}"></td>

                                <!-- 时间段 -->
                                <td th:text="${appointment.timeSlot}"></td>

                                <!-- 状态 -->
                                <td>
                                    <span th:switch="${appointment.status}">
                                        <span th:case="待确认" class="status-badge status-pending">待确认</span>
                                        <span th:case="已确认" class="status-badge status-confirmed">已确认</span>
                                        <span th:case="已取消" class="status-badge status-cancelled">已取消</span>
                                        <span th:case="*" class="status-badge bg-secondary">未知</span>
                                    </span>
                                </td>

                                <!-- 操作 -->
                                <td class="action-buttons">
                                    <!-- 只有待确认状态的预约可以操作 -->
                                    <button th:if="${appointment.status == '待确认'}"
                                            class="btn btn-success btn-sm"
                                            th:onclick="'confirmAppointment(' + ${appointment.id} + ')'">
                                        <i class="fas fa-check"></i> 确认
                                    </button>
                                    <button th:if="${appointment.status == '待确认'}"
                                            class="btn btn-danger btn-sm"
                                            th:onclick="'showCancelModal(' + ${appointment.id} + ')'">
                                        <i class="fas fa-times"></i> 取消
                                    </button>
                                    <!-- 查看详情按钮（所有状态都可查看） -->
                                    <button class="btn btn-primary btn-sm"
                                            th:onclick="'showAppointmentDetail(' + ${appointment.id} + ')'">
                                        <i class="fas fa-eye"></i> 详情
                                    </button>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 取消预约模态框 -->
<div class="modal fade" id="cancelModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">取消预约</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="cancelForm">
                    <input type="hidden" id="cancelAppointmentId">
                    <div class="mb-3">
                        <label for="cancelReason" class="form-label">取消原因</label>
                        <textarea class="form-control" id="cancelReason" rows="3" placeholder="请输入取消原因..." required></textarea>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- 预约详情模态框 -->
<div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">预约详情</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="detailContent">
                <!-- 详情内容将通过JavaScript动态加载 -->
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // 确认预约
    function confirmAppointment(appointmentId) {
        if (confirm('确认通过该预约吗？')) {
            updateAppointmentStatus(appointmentId, '已确认', null);
        }
    }

    // 完成预约
    function completeAppointment(appointmentId) {
        if (confirm('标记为已完成吗？')) {
            updateAppointmentStatus(appointmentId, '已完成', null);
        }
    }


    // 更新预约状态
    function updateAppointmentStatus(appointmentId, status, reason) {
        fetch('/doctor/appointments/update-status', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: new URLSearchParams({
                'appointmentId': appointmentId,
                'status': status,
                'rejectReason': reason || ''
            })
        })
            .then(response => response.json())
            .then(data => {
                if (data.success === "true") {
                    alert('操作成功！');
                    location.reload();
                } else {
                    alert('操作失败: ' + data.msg);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('操作失败，请稍后重试');
            });
    }

    // 显示预约详情
    function showAppointmentDetail(appointmentId) {
        fetch('/doctor/appointments/detail/' + appointmentId)
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const appointment = data.appointment;
                    let detailHtml = `
                            <div class="row">
                                <div class="col-md-6">
                                    <p><strong>患者姓名：</strong>${appointment.patientName || '未知'}</p>
                                    <p><strong>性别：</strong>${appointment.patientGender || '未知'}</p>
                                    <p><strong>年龄：</strong>${appointment.patientAge || '未知'}</p>
                                    <p><strong>联系电话：</strong>${appointment.patientPhone || '未知'}</p>
                                </div>
                                <div class="col-md-6">
                                    <p><strong>预约科室：</strong>${appointment.departmentName || '未知'}</p>
                                    <p><strong>预约医生：</strong>${appointment.doctorName || '未知'}</p>
                                    <p><strong>预约日期：</strong>${appointment.appointmentDate || '未知'}</p>
                                    <p><strong>时间段：</strong>${appointment.timeSlot || '未知'}</p>
                                </div>
                            </div>
                            <div class="row mt-3">
                                <div class="col-12">
                                    <p><strong>就诊原因：</strong>${appointment.reason || '无'}</p>
                                    <p><strong>备注信息：</strong>${appointment.notes || '无'}</p>
                                    <p><strong>预约状态：</strong>${appointment.status || '未知'}</p>
                                    ${appointment.rejectReason ? `<p><strong>取消原因：</strong>${appointment.rejectReason}</p>` : ''}
                                    <p><strong>创建时间：</strong>${appointment.createdTime || '未知'}</p>
                                </div>
                            </div>
                        `;

                    document.getElementById('detailContent').innerHTML = detailHtml;
                    const modal = new bootstrap.Modal(document.getElementById('detailModal'));
                    modal.show();
                } else {
                    alert('获取详情失败: ' + data.msg);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('获取详情失败，请稍后重试');
            });
    }

    // 刷新页面
    function refreshPage() {
        location.reload();
    }

    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', function() {
        // 可以添加一些初始化逻辑
    });
</script>
</body>
</html>
