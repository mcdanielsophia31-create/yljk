<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="content">
    <!-- 搜索框 -->
    <div class="row mb-4">
        <div class="col-md-6">
            <div class="input-group">
                <input type="text" id="patient-search-input" class="form-control"
                       placeholder="输入患者姓名搜索" th:value="${searchName}">
                <button class="btn btn-primary" type="button" onclick="searchPatients()">
                    <i class="fas fa-search"></i> 搜索
                </button>
                <button class="btn btn-outline-secondary" type="button" onclick="clearSearch()">
                    <i class="fas fa-redo"></i> 重置
                </button>
            </div>
        </div>
    </div>

    <!-- 患者表格 -->
    <div class="table-responsive">
        <table class="table table-hover">
            <thead>
            <tr>
                <th>ID</th>
                <th>姓名</th>
                <th>性别</th>
                <th>身份证号</th>
                <th>电话</th>
                <th>邮箱</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="patientInfo : ${patientInfoList}" th:if="${patientInfoList != null and !patientInfoList.isEmpty()}">
                <td th:text="${patientInfo.id}">1</td>
                <td th:text="${patientInfo.name}">张三</td>
                <td th:text="${patientInfo.gender}">男</td>
                <td th:text="${patientInfo.idCard}">110101199001011234</td>
                <td th:text="${patientInfo.phone}">13800138000</td>
                <td th:text="${patientInfo.email}">zhangsan@example.com</td>
                <td>
                    <button class="btn btn-sm btn-outline-primary patient-detail-btn"
                            th:data-name="${patientInfo.name}"
                            th:data-last-login="${patientInfo.lastLoginTime}"
                            th:data-status="${patientInfo.status}">
                        <i class="fas fa-eye"></i> 查看
                    </button>
                    <button class="btn btn-sm btn-outline-secondary"
                            th:attr="onclick=${'openPatientRecordsModal(' + patientInfo.id + ')'}">
                        <i class="fas fa-file-medical"></i> 查看历史病例
                    </button>
                </td>
            </tr>
            <tr th:if="${patientInfoList == null or patientInfoList.isEmpty()}">
                <td colspan="7" class="text-center text-muted py-4">
                    <i class="fas fa-user-slash fa-2x mb-2 d-block"></i>
                    暂无患者数据
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- 患者详情模态窗口 -->
    <div class="modal fade" id="patientDetailModal" tabindex="-1" aria-labelledby="patientDetailModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="patientDetailModalLabel">患者详情</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-bold">患者姓名：</label>
                        <p id="modalPatientName" class="mb-0">-</p>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">最后登录时间：</label>
                        <p id="modalLastLoginTime" class="mb-0">-</p>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">状态：</label>
                        <p id="modalStatus" class="mb-0">-</p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="patientRecordsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">历史病例</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-5">
                            <ul class="list-group" id="recordsList"></ul>
                        </div>
                        <div class="col-md-7">
                            <div id="recordDetail" class="border rounded p-3" style="min-height: 240px;"></div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>
</th:block>
<script>
    function openPatientRecordsModal(patientId) {
        const listEl = document.getElementById('recordsList');
        const detailEl = document.getElementById('recordDetail');
        if (listEl) listEl.innerHTML = '';
        if (detailEl) detailEl.innerHTML = '';
        fetch('/admin/api/patients/' + encodeURIComponent(patientId) + '/medical-records')
            .then(r => r.ok ? r.json() : [])
            .then(data => {
                if (!Array.isArray(data) || data.length === 0) {
                    if (listEl) listEl.innerHTML = '<li class="list-group-item text-muted">暂无病历记录</li>';
                } else {
                    data.forEach(item => {
                        const li = document.createElement('li');
                        li.className = 'list-group-item d-flex justify-content-between align-items-center';
                        const left = document.createElement('div');
                        left.innerHTML = '<div class="fw-bold">' + (item.diagnosis || '未填写诊断') + '</div>' +
                            '<div class="text-muted small">' + (item.visitDate || '') + ' · ' +
                            (item.doctorName || '') + ' · ' + (item.departmentName || '') + '</div>';
                        const btn = document.createElement('button');
                        btn.className = 'btn btn-sm btn-outline-primary';
                        btn.textContent = '查看';
                        btn.onclick = function() { viewRecordDetail(item.id); };
                        li.appendChild(left);
                        li.appendChild(btn);
                        listEl.appendChild(li);
                    });
                }
                const modal = new bootstrap.Modal(document.getElementById('patientRecordsModal'));
                modal.show();
            })
            .catch(() => {
                if (listEl) listEl.innerHTML = '<li class="list-group-item text-danger">加载失败</li>';
            });
    }
    function viewRecordDetail(recordId) {
        const el = document.getElementById('recordDetail');
        if (el) el.innerHTML = '<div class="text-muted">加载中...</div>';
        fetch('/admin/api/medical-records/' + encodeURIComponent(recordId))
            .then(r => r.ok ? r.json() : null)
            .then(rec => {
                if (!rec) {
                    if (el) el.innerHTML = '<div class="text-danger">未找到记录</div>';
                    return;
                }
                const html = [
                    '<div class="mb-2"><span class="fw-bold">就诊日期：</span>' + (rec.visitDate || '') + '</div>',
                    '<div class="mb-2"><span class="fw-bold">诊断：</span>' + (rec.diagnosis || '') + '</div>',
                    '<div class="mb-2"><span class="fw-bold">主诉：</span>' + (rec.chiefComplaint || '') + '</div>',
                    '<div class="mb-2"><span class="fw-bold">现病史：</span>' + (rec.presentIllness || '') + '</div>',
                    '<div class="mb-2"><span class="fw-bold">既往史：</span>' + (rec.pastIllness || '') + '</div>',
                    '<div class="mb-2"><span class="fw-bold">体格检查：</span>' + (rec.physicalExamination || '') + '</div>',
                    '<div class="mb-2"><span class="fw-bold">辅助检查：</span>' + (rec.auxiliaryExamination || '') + '</div>',
                    '<div class="mb-2"><span class="fw-bold">治疗方案：</span>' + (rec.treatmentPlan || '') + '</div>'
                ].join('');
                if (el) el.innerHTML = html;
            })
            .catch(() => {
                if (el) el.innerHTML = '<div class="text-danger">加载失败</div>';
            });
    }
</script>
