<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑医生 - 医疗健康管理系统</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/css/all.min.css}">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .sidebar {
            background: linear-gradient(135deg, #36B37E 0%, #00A3BF 100%);
            min-height: 100vh;
            color: white;
            position: fixed;
            width: 250px;
            padding-top: 20px;
            transition: all 0.3s;
            z-index: 100;
        }

        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.8);
            padding: 12px 20px;
            margin: 5px 15px;
            border-radius: 8px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
        }

        .sidebar .nav-link i {
            margin-right: 12px;
            width: 20px;
            text-align: center;
        }

        .sidebar .nav-link:hover {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .sidebar .nav-link.active {
            background: rgba(255, 255, 255, 0.25);
            color: white;
        }

        .sidebar-sticky {
            padding-top: 20px;
        }

        .main-content {
            margin-left: 250px;
            padding: 20px;
            transition: all 0.3s;
        }

        .page-header {
            background: linear-gradient(135deg, #36B37E 0%, #00A3BF 100%);
            color: white;
            padding: 30px 0;
            margin-bottom: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card {
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: none;
            margin-bottom: 20px;
        }

        .card-header {
            background: linear-gradient(135deg, #36B37E 0%, #00A3BF 100%);
            color: white;
            border-radius: 10px 10px 0 0 !important;
            font-weight: 600;
            padding: 15px 20px;
        }

        .form-control {
            border-radius: 8px;
            border: 2px solid #e9ecef;
            padding: 8px 12px;
        }

        .form-control:focus {
            border-color: #36B37E;
            box-shadow: 0 0 0 0.2rem rgba(54, 179, 126, 0.25);
        }

        .btn-primary, .btn-secondary {
            border-radius: 20px;
            padding: 8px 20px;
            margin-right: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #36B37E 0%, #00A3BF 100%);
            border: none;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #6c757d 0%, #5a6268 100%);
            border: none;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .container {
            max-width: 1200px;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                min-height: auto;
                position: relative;
            }
            
            .main-content {
                margin-left: 0;
            }
            
            .sidebar .nav-link {
                display: inline-block;
                margin: 2px 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- 侧边栏 -->
            <nav class="col-md-2 d-md-block sidebar">
                <div class="sidebar-sticky">
                    <h6 class="sidebar-heading d-flex justify-content-between align-items-center px-3 mt-4 mb-1 text-muted">
                        <span>管理员功能</span>
                    </h6>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/dashboard}">
                                <i class="fas fa-home"></i> 仪表板
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/patients}">
                                <i class="fas fa-users"></i> 患者管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" th:href="@{/admin/doctors}">
                                <i class="fas fa-user-md"></i> 医生管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/departments}">
                                <i class="fas fa-building"></i> 科室管理
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- 主内容区 -->
            <main class="col-md-10 ml-sm-auto px-4 main-content">
                <div class="page-header">
                    <div class="container-fluid">
                        <h1 class="h2 mb-0">编辑医生</h1>
                        <p class="mb-0">修改医生信息</p>
                    </div>
                </div>

                <div class="container">
                    <div class="card">
                        <div class="card-header">
                            <h4 class="mb-0">编辑医生信息</h4>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/admin/doctors/edit/{id}(id=${doctor.id})}" method="post">
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label class="form-label">医生ID</label>
                                            <input type="text" class="form-control" th:value="${doctor.id}" readonly>
                                        </div>
                                        
                                        <div class="mb-3">
                                            <label class="form-label">姓名</label>
                                            <input type="text" class="form-control" th:value="${doctor.name}" readonly>
                                        </div>
                                        
                                        <div class="mb-3">
                                            <label class="form-label">工号</label>
                                            <input type="text" class="form-control" th:value="${doctor.employeeId}" readonly>
                                        </div>
                                        
                                        <div class="mb-3">
                                            <label class="form-label">性别</label>
                                            <input type="text" class="form-control" th:value="${doctor.gender}" readonly>
                                        </div>
                                        
                                        <div class="mb-3">
                                            <label class="form-label">联系电话</label>
                                            <input type="text" class="form-control" name="phone" th:value="${doctor.phone}" required>
                                        </div>
                                    </div>
                                    
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label class="form-label">邮箱</label>
                                            <input type="email" class="form-control" name="email" th:value="${doctor.email}" required>
                                        </div>
                                        
                                        <div class="mb-3">
                                            <label class="form-label">所属科室</label>
                                            <select class="form-control" name="departmentId" required>
                                                <option th:each="dept : ${departments}" 
                                                        th:value="${dept.id}" 
                                                        th:text="${dept.name}" 
                                                        th:selected="${dept.id == doctor.departmentId}"></option>
                                            </select>
                                        </div>
                                        
                                        <div class="mb-3">
                                            <label class="form-label">职称</label>
                                            <select class="form-control" name="title">
                                                <option value="住院医师" th:selected="${doctor.title == '住院医师'}">住院医师</option>
                                                <option value="主治医师" th:selected="${doctor.title == '主治医师'}">主治医师</option>
                                                <option value="副主任医师" th:selected="${doctor.title == '副主任医师'}">副主任医师</option>
                                                <option value="主任医师" th:selected="${doctor.title == '主任医师'}">主任医师</option>
                                            </select>
                                        </div>
                                        
                                        <div class="mb-3">
                                            <label class="form-label">专业领域</label>
                                            <input type="text" class="form-control" name="specialty" th:value="${doctor.specialty}">
                                        </div>
                                    </div>
                                </div>
                                
                                <button type="submit" class="btn btn-primary">更新医生信息</button>
                                <a href="/admin/doctors" class="btn btn-secondary">取消</a>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
