<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创建医生 - 医疗健康管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/unified-style.css}">
</head>
<body>
<!-- 左侧侧边栏导航 -->
<div class="sidebar" id="sidebar">
    <!-- 侧边栏内容 -->
</div>

<!-- 主内容区域 -->
<div class="main-content" id="mainContent">
    <!-- 顶部标题栏 -->
    <div class="page-header">
        <div>
            <h1>创建医生</h1>
            <p>欢迎，<span id="userName" th:text="${user != null ? user.realName : '管理员'}">管理员</span>，创建新医生账号</p>
        </div>
        <div class="header-actions">
            <button class="btn btn-outline-custom" onclick="location.href='/admin/dashboard'">
                <i class="fas fa-arrow-left"></i> 返回首页
            </button>
            <button class="btn btn-primary-custom" onclick="location.href='/logout'">
                <i class="fas fa-sign-out-alt"></i> 退出
            </button>
        </div>
    </div>

    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card">
                <div class="card-header">
                    <h5><i class="fas fa-user-md me-2"></i>创建新医生</h5>
                </div>
                <div class="card-body">
                    <form id="createDoctorForm">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="realName" class="form-label">真实姓名 <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="realName" name="realName" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="employeeId" class="form-label">工号 <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="employeeId" name="employeeId" readonly>
                                    <div class="form-text">工号将根据医院ID自动生成</div>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="hospitalId" class="form-label">所属医院 <span class="text-danger">*</span></label>
                                    <select class="form-select" id="hospitalId" name="hospitalId" required>
                                        <option value="">请选择医院</option>
                                        <option value="1">人民医院</option>
                                        <option value="2">中医院</option>
                                        <option value="3">妇幼保健院</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="departmentId" class="form-label">所属科室 <span class="text-danger">*</span></label>
                                    <select class="form-select" id="departmentId" name="departmentId" required>
                                        <option value="">请选择科室</option>
                                        <option value="1">内科</option>
                                        <option value="2">外科</option>
                                        <option value="3">儿科</option>
                                        <option value="4">妇科</option>
                                        <option value="5">眼科</option>
                                        <option value="6">耳鼻喉科</option>
                                        <option value="7">口腔科</option>
                                        <option value="8">皮肤科</option>
                                        <option value="9">中医科</option>
                                        <option value="10">急诊科</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="title" class="form-label">职称 <span class="text-danger">*</span></label>
                                    <select class="form-select" id="title" name="title" required>
                                        <option value="">请选择职称</option>
                                        <option value="住院医师">住院医师</option>
                                        <option value="主治医师">主治医师</option>
                                        <option value="副主任医师">副主任医师</option>
                                        <option value="主任医师">主任医师</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="phone" class="form-label">手机号码</label>
                                    <input type="tel" class="form-control" id="phone" name="phone" placeholder="可选，首次登录时绑定">
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">医生简介</label>
                            <textarea class="form-control" id="description" name="description" rows="3" placeholder="请输入医生简介"></textarea>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-plus me-1"></i>创建医生账号
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', function() {
        // 监听医院选择变化，自动生成工号
        document.getElementById('hospitalId').addEventListener('change', function() {
            const hospitalId = this.value;
            if (hospitalId) {
                // 根据医院ID生成工号前缀
                const prefix = hospitalId.padStart(3, '0');
                // 生成随机后缀
                const suffix = Math.floor(1000 + Math.random() * 9000);
                const employeeId = prefix + suffix;
                document.getElementById('employeeId').value = employeeId;
            } else {
                document.getElementById('employeeId').value = '';
            }
        });

        // 处理表单提交
        document.getElementById('createDoctorForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const doctorData = Object.fromEntries(formData);

            // 验证必填字段
            if (!doctorData.realName || !doctorData.employeeId || !doctorData.hospitalId || !doctorData.departmentId || !doctorData.title) {
                alert('请填写所有必填字段');
                return;
            }

            // 发送创建医生请求
            fetch('/admin/doctors/create', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(doctorData)
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert('医生账号创建成功！默认密码为：123456');
                        // 重置表单
                        this.reset();
                        document.getElementById('employeeId').value = '';
                    } else {
                        alert('创建失败：' + (data.msg || '未知错误'));
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('创建失败：' + error.message);
                });
        });
    });
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
