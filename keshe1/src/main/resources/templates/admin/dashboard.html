<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员工作站 - 医疗健康管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/unified-style.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif;
            background-color: #F5F7FA;
            overflow-x: hidden;
        }

        /* ============ 左侧侧边栏 - 黑色主题 ============ */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 260px;
            background: linear-gradient(135deg, #1F2937 0%, #111827 100%);
            box-shadow: 3px 0 15px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar.collapsed {
            width: 70px;
        }

        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .sidebar-header {
            padding: 25px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
        }

        .sidebar.collapsed .sidebar-header {
            padding: 15px 5px;
        }

        .sidebar-header .user-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4F46E5, #7C3AED);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .sidebar.collapsed .user-avatar {
            width: 40px;
            height: 40px;
            font-size: 18px;
        }

        .sidebar-header h5 {
            font-size: 18px;
            font-weight: 600;
            color: #FFFFFF;
            margin-bottom: 5px;
            transition: all 0.3s;
        }

        .sidebar.collapsed .sidebar-header h5,
        .sidebar.collapsed .sidebar-header small {
            display: none;
        }

        .sidebar-header small {
            color: #D1D5DB;
            font-size: 12px;
        }

        .sidebar-nav {
            padding: 15px 0;
        }

        .nav-item {
            margin: 5px 15px;
        }

        .sidebar.collapsed .nav-item {
            margin: 5px 10px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 14px 15px;
            color: #D1D5DB;
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 14px;
            font-weight: 500;
            position: relative;
            overflow: hidden;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #FFFFFF;
            transform: translateX(3px);
        }

        .nav-link.active {
            background: linear-gradient(90deg, #4F46E5 0%, #7C3AED 100%);
            color: #FFFFFF;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
        }

        .nav-link i {
            min-width: 20px;
            margin-right: 12px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .sidebar.collapsed .nav-link i {
            margin-right: 0;
        }

        .sidebar.collapsed .nav-link .nav-text {
            display: none;
        }

        .nav-link .chevron {
            margin-left: auto;
            font-size: 12px;
            transition: transform 0.3s;
        }

        .nav-link.expanded .chevron {
            transform: rotate(180deg);
        }

        .submenu {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .submenu.show {
            max-height: 500px;
        }

        .submenu .nav-link {
            padding-left: 47px;
            font-size: 13px;
            color: #9CA3AF;
        }

        .sidebar.collapsed .submenu {
            display: none;
        }

        .toggle-sidebar-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: transparent;
            border: 2px solid rgba(79, 70, 229, 0.3);
            color: #4F46E5;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            z-index: 10;
        }

        .toggle-sidebar-btn:hover {
            background: #4F46E5;
            color: #FFFFFF;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
        }

        /* ============ 主内容区域 ============ */
        .main-content {
            margin-left: 260px;
            padding: 30px;
            transition: margin-left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            min-height: 100vh;
            padding-bottom: 100px;
        }

        .main-content.full-width {
            margin-left: 70px;
        }

        .dashboard-header {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 28px 32px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            margin-bottom: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dashboard-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1A1A1A;
            margin-bottom: 6px;
        }

        .dashboard-header p {
            font-size: 14px;
            color: #9CA3AF;
            margin: 0;
        }

        .header-actions .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            margin-left: 10px;
        }

        .btn-primary-custom {
            background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
            border: none;
            color: white;
        }

        .btn-primary-custom:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
        }

        .btn-outline-custom {
            border: 2px solid #E5E7EB;
            color: #6B7280;
            background: white;
        }

        .btn-outline-custom:hover {
            border-color: #4F46E5;
            color: #4F46E5;
            background: #F0F4FF;
        }

        /* ============ 卡片样式 ============ */
        .card {
            background: #FFFFFF;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid #F3F4F6;
            margin-bottom: 24px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card:hover {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            transform: translateY(-4px);
        }

        .card-header {
            padding: 20px 24px;
            border-bottom: 1px solid #F3F4F6;
            background: transparent;
        }

        .card-header h5 {
            font-size: 18px;
            font-weight: 600;
            color: #1A1A1A;
            margin: 0;
        }

        .card-body {
            padding: 24px;
        }

        /* 统计卡片 */
        .stat-card {
            text-align: center;
            padding: 24px 16px;
            background: linear-gradient(135deg, #FFFFFF 0%, #F9FAFB 100%);
            border: 2px solid #F0F4FF;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(79, 70, 229, 0.1) 0, transparent 70%);
            transition: all 0.5s;
        }

        .stat-card:hover::before {
            top: -30%;
            right: -30%;
        }

        .stat-card .icon {
            font-size: 32px;
            color: #4F46E5;
            margin-bottom: 12px;
        }

        .stat-card .number {
            font-size: 32px;
            font-weight: 700;
            color: #1A1A1A;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
        }

        .stat-card .label {
            font-size: 14px;
            color: #6B7280;
            font-weight: 500;
            position: relative;
            z-index: 1;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .sidebar {
                width: 70px;
            }
            .sidebar-header h5,
            .sidebar-header small,
            .nav-text,
            .submenu {
                display: none;
            }
            .main-content {
                margin-left: 70px;
            }
        }
    </style>
</head>

<!-- 引入Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // 侧边栏折叠
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('mainContent');
        const toggleIcon = document.getElementById('toggleIcon');

        sidebar.classList.toggle('collapsed');
        mainContent.classList.toggle('full-width');

        if (sidebar.classList.contains('collapsed')) {
            toggleIcon.classList.remove('fa-angles-left');
            toggleIcon.classList.add('fa-angles-right');
        } else {
            toggleIcon.classList.remove('fa-angles-right');
            toggleIcon.classList.add('fa-angles-left');
        }
    }

    // 子菜单折叠/展开
    function toggleSubmenu(linkElement) {
        const submenu = linkElement.nextElementSibling;
        const allSubmenus = document.querySelectorAll('.submenu');
        const allLinks = document.querySelectorAll('.nav-link');
        
        // 关闭其他子菜单
        allSubmenus.forEach(menu => {
            if (menu !== submenu && menu.classList.contains('show')) {
                menu.classList.remove('show');
            }
        });
        
        // 移除其他链接的expanded状态
        allLinks.forEach(link => {
            if (link !== linkElement && link.classList.contains('expanded')) {
                link.classList.remove('expanded');
            }
        });
        
        // 切换当前子菜单
        if (submenu) {
            submenu.classList.toggle('show');
            linkElement.classList.toggle('expanded');
        }
    }

    // AJAX加载内容
    function loadContent(url, title) {
        const mainContent = document.getElementById('mainContent');

        fetch(url, {
            method: 'GET',
            headers: {
                'Content-Type': 'text/html',
                'X-Requested-With': 'XMLHttpRequest'  // 标识这是一个AJAX请求
            }
        })
            .then(response => {
                if (!response.ok) {
                    // 不跨级，改为在同一页面显示错误
                    mainContent.innerHTML = `
                    <div class="error-alert" style="background: linear-gradient(135deg, #FFE6E6 0%, #FFF0F0 100%); border-left: 5px solid #DC3545; border-radius: 8px; padding: 30px; margin: 20px;">
                        <h3 style="color: #DC3545; font-size: 22px; font-weight: 600; margin-bottom: 15px;">功能暂未开放</h3>
                        <p style="color: #6B7280; font-size: 14px; line-height: 1.6; margin-bottom: 20px;">抱歉，您访问的功能暂时不可用或还在开发中，请稍后再试。</p>
                    </div>
                `;
                    return null;
                }
                return response.text();
            })
            .then(html => {
                if (!html) return;

                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');

                // 移除不需要的元素
                const sidebar = doc.querySelector('.sidebar');
                const toggleBtn = doc.querySelector('.toggle-sidebar-btn');
                if (sidebar) sidebar.remove();
                if (toggleBtn) toggleBtn.remove();

                // 获取主要内容
                let contentElement = doc.querySelector('.main-content') ||
                    doc.querySelector('.container-fluid') ||
                    doc.querySelector('.card') ||
                    doc.body;

                if (contentElement) {
                    mainContent.innerHTML = contentElement.innerHTML;
                }

                // 提取并执行脚本
                const scripts = doc.querySelectorAll('script');
                scripts.forEach(script => {
                    const newScript = document.createElement('script');
                    newScript.textContent = script.textContent;

    function initDashboardCharts() {
        const trendSelect = document.getElementById('trendRangeSelect');
        const trendCanvas = document.getElementById('trendChart');
        if (trendSelect && trendCanvas) {
            const initDays = parseInt(trendSelect.value, 10) || 7;
            updateTrendChart(initDays);
            updateAgeDistribution(initDays);
            trendSelect.addEventListener('change', () => {
                const days = parseInt(trendSelect.value, 10) || 7;
                updateTrendChart(days);
                updateAgeDistribution(days);
            });
        }
    }

    function updateAgeDistribution(days) {
        fetch('/admin/dashboard/age-distribution?days=' + encodeURIComponent(days))
            .then(r => r.ok ? r.json() : [])
            .then(data => {
                const labelsRaw = data.map(d => d.label);
                const counts = data.map(d => d.count);
                const total = counts.reduce((s, v) => s + (v || 0), 0);
                const el = document.getElementById('ageDonutChart');
                if (!el) return;
                const parent = el.parentElement;
                if (total === 0) {
                    parent.innerHTML = '';
                    const placeholder = document.createElement('div');
                    placeholder.className = 'text-muted text-center';
                    placeholder.style.padding = '40px 0';
                    placeholder.textContent = '暂无患者年龄数据';
                    parent.appendChild(placeholder);
                    window.ageDonutChartInstance = null;
                    return;
                }
                const ctx = el.getContext('2d');
                const labels = labelsRaw.map((l, i) => {
                    const pct = total > 0 ? Math.round((counts[i] / total) * 1000) / 10 : 0;
                    return `${l}（${pct}%）`;
                });
                const dataset = {
                    data: counts,
                    backgroundColor: ['#5B8FF9', '#61DDAA', '#65789B', '#F6BD16', '#7262FD', '#78D3F8', '#F6903D']
                };
                if (window.ageDonutChartInstance) {
                    window.ageDonutChartInstance.data.labels = labels;
                    window.ageDonutChartInstance.data.datasets[0].data = counts;
                    window.ageDonutChartInstance.update();
                    return;
                }
                window.ageDonutChartInstance = new Chart(ctx, {
                    type: 'doughnut',
                    data: { labels: labels, datasets: [dataset] },
                    options: {
                        responsive: true,
                        plugins: { 
                            legend: { position: 'bottom' },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        const idx = context.dataIndex;
                                        const value = counts[idx] || 0;
                                        const pct = total > 0 ? Math.round((value / total) * 1000) / 10 : 0;
                                        return `${labelsRaw[idx]}：${value}人（${pct}%）`;
                                    }
                                }
                            }
                        }
                    }
                });
            });
    }

    function updateTrendChart(days) {
        fetch('/admin/dashboard/appointment-trend?days=' + encodeURIComponent(days))
            .then(r => r.ok ? r.json() : [])
            .then(data => {
                const labels = data.map(d => d.date);
                const totals = data.map(d => d.total || 0);
                const pendings = data.map(d => d.pending || 0);
                const canceled = data.map(d => d.canceled || 0);
                const confirmed = data.map(d => d.confirmed || 0);
                const maxCount = Math.max(
                    totals.length ? Math.max(...totals) : 0,
                    pendings.length ? Math.max(...pendings) : 0,
                    canceled.length ? Math.max(...canceled) : 0,
                    confirmed.length ? Math.max(...confirmed) : 0
                );
                const el = document.getElementById('trendChart');
                if (!el) return;
                const ctx = el.getContext('2d');
                const datasets = [
                    {
                        label: '总计',
                        data: totals,
                        borderColor: '#4F46E5',
                        backgroundColor: 'rgba(79,70,229,0.15)',
                        tension: 0.3,
                        fill: false,
                        pointRadius: 3,
                        pointBackgroundColor: '#4F46E5'
                    },
                    {
                        label: '待确认',
                        data: pendings,
                        borderColor: '#F6BD16',
                        backgroundColor: 'rgba(246,189,22,0.15)',
                        tension: 0.3,
                        fill: false,
                        pointRadius: 3,
                        pointBackgroundColor: '#F6BD16'
                    },
                    {
                        label: '已取消',
                        data: canceled,
                        borderColor: '#FF7070',
                        backgroundColor: 'rgba(255,112,112,0.15)',
                        tension: 0.3,
                        fill: false,
                        pointRadius: 3,
                        pointBackgroundColor: '#FF7070'
                    },
                    {
                        label: '已确认',
                        data: confirmed,
                        borderColor: '#61DDAA',
                        backgroundColor: 'rgba(97,221,170,0.15)',
                        tension: 0.3,
                        fill: false,
                        pointRadius: 3,
                        pointBackgroundColor: '#61DDAA'
                    }
                ];
                if (window.trendChartInstance) {
                    window.trendChartInstance.data.labels = labels;
                    window.trendChartInstance.data.datasets = datasets;
                    if (window.trendChartInstance.options && window.trendChartInstance.options.scales && window.trendChartInstance.options.scales.y) {
                        window.trendChartInstance.options.scales.y.suggestedMax = maxCount < 5 ? 5 : maxCount;
                        window.trendChartInstance.options.scales.y.ticks = Object.assign(
                            {},
                            window.trendChartInstance.options.scales.y.ticks || {},
                            { stepSize: 1 }
                        );
                    }
                    window.trendChartInstance.update();
                    return;
                }
                window.trendChartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: datasets
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { display: true, position: 'top' } },
                        scales: { 
                            y: { 
                                beginAtZero: true,
                                suggestedMax: maxCount < 5 ? 5 : maxCount,
                                title: { display: true, text: '患者人数' },
                                ticks: { stepSize: 1 }
                            },
                            x: {
                                title: { display: true, text: '时间' }
                            }
                        }
                    }
                });
            });
    }

            loadDoctors(input.value);
        }
    }

    // 清除医生搜索
    function clearDoctorSearch() {
        const input = document.getElementById('doctor-search-input');
        if (input) {
            input.value = '';
            loadDoctors('');
        }
    }
    // 重置医生密码（全局），供医生列表片段调用
    window.resetDoctorPassword = function(doctorId) {
        if (!doctorId) return;
        if (!confirm('确认将该医生密码重置为 123456 ？')) return;
        fetch('/admin/doctors/' + encodeURIComponent(doctorId) + '/reset-password', {
            method: 'POST'
        })
        .then(r => r.ok ? r.json() : Promise.reject(r))
        .then(res => {
            if (res && res.success) {
                alert('密码重置成功：123456');
                const input = document.getElementById('doctor-search-input');
                const q = input ? input.value : '';
                loadDoctors(q || '');
            } else {
                alert('重置失败');
            }
        })
        .catch(async (err) => {
            try {
                const text = await err.text();
                alert('重置失败：' + text);
            } catch (e) {
                alert('重置失败');
            }
        });
    };
</script>
</body>
</html>
