<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医疗健康管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="text-center mb-5">
                    <h1 class="display-4">医疗健康管理系统</h1>
                    <p class="lead">请选择医院和您的用户类型进入系统</p>
                </div>
                
                <!-- 医院选择 -->
                <div class="row mb-4">
                    <div class="col-md-12">
                        <div class="card">
                            <div class="card-header">
                                <h5>请选择医院</h5>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-6 mb-2" th:each="hospital : ${hospitals}">
                                        <button class="btn btn-outline-primary w-100 hospital-btn" 
                                                th:data-hospital-id="${hospital.id}" 
                                                th:data-hospital-name="${hospital.name}" 
                                                th:text="${hospital.name}">
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="row" id="user-entries" style="display: none;">
                    <!-- 病人入口 -->
                    <div class="col-md-4 mb-4">
                        <div class="card h-100">
                            <div class="card-body text-center">
                                <h5 class="card-title">病人入口</h5>
                                <p class="card-text">如果您是病人，可以在此登录或注册账户。</p>
                                <a href="/patient/login" class="btn btn-primary">病人登录</a>
                                <a href="/patient/register" class="btn btn-outline-primary">病人注册</a>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 医生入口 -->
                    <div class="col-md-4 mb-4">
                        <div class="card h-100">
                            <div class="card-body text-center">
                                <h5 class="card-title">医生入口</h5>
                                <p class="card-text">如果您是医生，请在此登录。<br>支持工号和电话号码登录。</p>
                                <a href="/doctor/login" class="btn btn-success" id="doctor-login-link">医生登录</a>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 管理员入口 -->
                    <div class="col-md-4 mb-4">
                        <div class="card h-100">
                            <div class="card-body text-center">
                                <h5 class="card-title">管理员入口</h5>
                                <p class="card-text">医院管理员请在此登录。</p>
                                <a href="/admin/login" class="btn btn-warning" id="admin-login-link">管理员登录</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 医院选择逻辑
        document.querySelectorAll('.hospital-btn').forEach(button => {
            button.addEventListener('click', function() {
                // 移除所有按钮的激活状态
                document.querySelectorAll('.hospital-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                
                // 添加当前按钮的激活状态
                this.classList.add('active');
                
                // 显示用户入口
                document.getElementById('user-entries').style.display = 'flex';
                
                // 获取医院信息
                const hospitalId = this.getAttribute('data-hospital-id');
                const hospitalName = this.getAttribute('data-hospital-name');
                
                // 更新医生和管理员登录链接
                document.getElementById('doctor-login-link').href = `/doctor/login?hospitalId=${hospitalId}`;
                document.getElementById('admin-login-link').href = `/admin/login?hospitalId=${hospitalId}`;
                
                // 更新页面标题显示医院名称
                document.querySelector('.display-4').textContent = hospitalName + ' - 医疗健康管理系统';
            });
        });
    </script>
</body>
</html>
