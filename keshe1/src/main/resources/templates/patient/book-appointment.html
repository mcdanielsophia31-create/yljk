<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>预约挂号 - 医疗健康管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/patient/dashboard">医疗健康管理系统</a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3" th:text="'欢迎，' + ${user.realName}"></span>
                <a class="nav-link" href="/patient/logout">退出登录</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <!-- 侧边栏 -->
            <div class="col-md-2">
                <div class="list-group">
                    <a href="/patient/dashboard" class="list-group-item list-group-item-action">病人主页</a>
                    <a href="/patient/profile" class="list-group-item list-group-item-action">个人信息</a>
                    <a href="/patient/medical-records" class="list-group-item list-group-item-action">电子病历</a>
                    <a href="/patient/appointments" class="list-group-item list-group-item-action">我的预约</a>
                    <a href="/patient/appointments/book" class="list-group-item list-group-item-action active">预约挂号</a>
                    <a href="/patient/health-profile" class="list-group-item list-group-item-action">健康档案</a>
                </div>
            </div>

            <!-- 主内容区 -->
            <div class="col-md-10">
                <div class="card">
                    <div class="card-header">
                        <h4>预约挂号</h4>
                    </div>
                    <div class="card-body">
                        <form action="/patient/appointments/book" method="post">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="doctorId" class="form-label">选择医生</label>
                                        <select class="form-select" id="doctorId" name="doctorId" required>
                                            <option value="">请选择医生</option>
                                            <option th:each="doctor : ${doctors}" th:value="${doctor.id}"
                                                    th:text="${doctor.name + ' (' + doctor.title + ')'}"></option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="appointmentDate" class="form-label">预约日期</label>
                                        <input type="date" class="form-control" id="appointmentDate" name="appointmentDate" required>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="timeSlot" class="form-label">时间段</label>
                                        <select class="form-select" id="timeSlot" name="timeSlot" required>
                                            <option value="">请选择时间段</option>
                                            <option value="上午">上午 (08:00-12:00)</option>
                                            <option value="下午">下午 (12:00-18:00)</option>
                                            <option value="晚上">晚上 (18:00-22:00)</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary">提交预约</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
