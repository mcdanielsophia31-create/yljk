<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人信息管理 - 医疗健康管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/unified-style.css}">
    <style>
        /* ... 保留原有所有样式 ... */

        /* 添加弹框样式 */
        .profile-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            overflow-y: auto;
            padding: 20px;
        }

        .profile-modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 0;
            width: 90%;
            max-width: 800px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            animation: modalFadeIn 0.3s ease-out;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .profile-modal-header {
            padding: 20px 30px;
            background: linear-gradient(135deg, #36B37E 0%, #00A3BF 100%);
            color: white;
            border-radius: 16px 16px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .profile-modal-title {
            font-size: 24px;
            font-weight: 600;
            margin: 0;
        }

        .profile-modal-close {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s;
        }

        .profile-modal-close:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .profile-modal-body {
            padding: 30px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .profile-form-group {
            margin-bottom: 20px;
        }

        .profile-form-label {
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
            font-size: 14px;
            display: block;
        }

        .profile-form-control {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #E5E7EB;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
            background-color: white;
        }

        .profile-form-control:focus {
            outline: none;
            border-color: #36B37E;
            box-shadow: 0 0 0 3px rgba(54, 179, 126, 0.1);
        }

        .profile-form-control:disabled {
            background-color: #F9FAFB;
            color: #9CA3AF;
            cursor: not-allowed;
        }

        .profile-modal-footer {
            padding: 20px 30px;
            background-color: #F9FAFB;
            border-radius: 0 0 16px 16px;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .profile-modal-btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            min-width: 100px;
        }

        .profile-modal-btn-primary {
            background: linear-gradient(135deg, #36B37E 0%, #00A3BF 100%);
            color: white;
        }

        .profile-modal-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(54, 179, 126, 0.3);
        }

        .profile-modal-btn-secondary {
            background-color: #E5E7EB;
            color: #374151;
        }

        .profile-modal-btn-secondary:hover {
            background-color: #D1D5DB;
        }

        .profile-form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .profile-form-col {
            flex: 1;
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            .profile-form-row {
                flex-direction: column;
                gap: 0;
            }

            .profile-modal-body {
                padding: 20px;
                max-height: 60vh;
            }

            .profile-modal-content {
                width: 95%;
                margin: 10% auto;
            }
        }

        /* 错误提示样式 */
        .profile-error-message {
            color: #DC2626;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }

        .profile-error-message.show {
            display: block;
        }

        /* 成功提示样式 */
        .profile-success-message {
            color: #059669;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }

        .profile-success-message.show {
            display: block;
        }


        /* 头像上传相关样式 */
        .avatar-section {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 40px;
            padding: 20px;
            background: linear-gradient(135deg, rgba(54, 179, 126, 0.05) 0%, rgba(0, 163, 191, 0.05) 100%);
            border-radius: 16px;
            border: 1px solid rgba(54, 179, 126, 0.1);
        }

        .avatar-container {
            position: relative;
            width: 120px;
            height: 120px;
        }

        .avatar-display {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #36B37E;
            overflow: hidden;
            background: linear-gradient(135deg, #36B37E 0%, #00A3BF 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .avatar-display:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(54, 179, 126, 0.3);
        }

        .avatar-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .avatar-placeholder {
            font-size: 48px;
            font-weight: bold;
            color: white;
        }

        .avatar-upload-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #36B37E;
            color: white;
            border: 2px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 10;
        }

        .avatar-upload-btn:hover {
            background: #2E9E6E;
            transform: scale(1.1);
        }

        .avatar-info {
            flex: 1;
        }

        .avatar-info h5 {
            font-size: 20px;
            font-weight: 600;
            color: #1A1A1A;
            margin-bottom: 8px;
        }

        .avatar-info p {
            font-size: 14px;
            color: #6B7280;
            margin-bottom: 0;
        }

        /* 头像上传弹框样式 */
        .avatar-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 3000;
            overflow-y: auto;
            padding: 20px;
        }

        .avatar-modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 0;
            width: 90%;
            max-width: 500px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            animation: modalFadeIn 0.3s ease-out;
        }

        .avatar-modal-header {
            padding: 20px 30px;
            background: linear-gradient(135deg, #36B37E 0%, #00A3BF 100%);
            color: white;
            border-radius: 16px 16px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .avatar-modal-title {
            font-size: 24px;
            font-weight: 600;
            margin: 0;
        }

        .avatar-modal-close {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s;
        }

        .avatar-modal-close:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .avatar-modal-body {
            padding: 30px;
        }

        .avatar-upload-area {
            border: 2px dashed #D1D5DB;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .avatar-upload-area:hover {
            border-color: #36B37E;
            background-color: rgba(54, 179, 126, 0.05);
        }

        .avatar-upload-area.drag-over {
            border-color: #36B37E;
            background-color: rgba(54, 179, 126, 0.1);
        }

        .avatar-upload-icon {
            font-size: 48px;
            color: #9CA3AF;
            margin-bottom: 16px;
        }

        .avatar-upload-text {
            font-size: 16px;
            color: #6B7280;
            margin-bottom: 8px;
        }

        .avatar-upload-hint {
            font-size: 14px;
            color: #9CA3AF;
        }

        .avatar-preview {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #36B37E;
            display: none;
        }

        .avatar-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-modal-footer {
            padding: 20px 30px;
            background-color: #F9FAFB;
            border-radius: 0 0 16px 16px;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .avatar-modal-btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            min-width: 100px;
        }

        .avatar-modal-btn-primary {
            background: linear-gradient(135deg, #36B37E 0%, #00A3BF 100%);
            color: white;
        }

        .avatar-modal-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(54, 179, 126, 0.3);
        }

        .avatar-modal-btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .avatar-modal-btn-secondary {
            background-color: #E5E7EB;
            color: #374151;
        }

        .avatar-modal-btn-secondary:hover {
            background-color: #D1D5DB;
        }

        .avatar-progress {
            height: 6px;
            background-color: #E5E7EB;
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
            display: none;
        }

        .avatar-progress-bar {
            height: 100%;
            background: linear-gradient(135deg, #36B37E 0%, #00A3BF 100%);
            width: 0%;
            transition: width 0.3s;
        }

        .avatar-error-message {
            color: #DC2626;
            font-size: 14px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }

        .avatar-success-message {
            color: #059669;
            font-size: 14px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }

        /* 文件选择样式 */
        .avatar-file-input {
            display: none;
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            .avatar-section {
                flex-direction: column;
                text-align: center;
                gap: 20px;
            }

            .avatar-container {
                width: 100px;
                height: 100px;
            }

            .avatar-display {
                width: 100px;
                height: 100px;
            }

            .avatar-modal-body {
                padding: 20px;
            }
        }
        /* 侧边栏头像样式 */
        .sidebar-header {
            padding: 20px;
            background: linear-gradient(135deg, #36B37E 0%, #00A3BF 100%);
            color: white;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            position: relative;
            width: 50px;
            height: 50px;
            min-width: 50px;
        }

        .user-avatar span {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            color: #36B37E;
            font-weight: bold;
            font-size: 18px;
            border: 2px solid white;
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid white;
        }

        .user-details h6 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
        }

        .user-details span {
            font-size: 12px;
            opacity: 0.9;
        }


    </style>
</head>
<body>
<!-- 左侧侧边栏导航 -->

<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="user-info">
            <!-- 头像容器 -->
            <div class="user-avatar" id="sidebarAvatar">
                <span id="sidebarAvatarPlaceholder"></span>
                <img id="sidebarAvatarImage" style="display: none;" alt="用户头像">
            </div>
            <div class="user-details">
                <h6 id="sidebarUserName">用户名</h6>
                <span id="sidebarUserRole">患者</span>
            </div>
        </div>
    </div>
    <!-- 其他菜单项 -->
</div>
<!-- 主内容区域 -->
<div class="main-content" id="mainContent">
    <!-- 顶部标题栏 -->
    <div class="page-header">
        <div>
            <h1>个人信息管理</h1>
            <p>查看和管理您的个人信息</p>
        </div>
        <div class="header-actions">
            <button class="btn btn-outline-custom" onclick="location.href='/patient/dashboard'">
                <i class="fas fa-arrow-left"></i> 返回首页
            </button>
            <button class="btn btn-primary-custom" onclick="location.href='/logout'">
                <i class="fas fa-sign-out-alt"></i> 退出
            </button>
        </div>
    </div>

    <!-- 头像上传区域 -->
    <div class="card shadow-sm border-0 rounded-lg mb-4">
        <div class="card-header bg-white border-bottom border-primary-subtle py-3">
            <h5 class="mb-0 text-primary">
                <i class="fas fa-user-circle me-2"></i>头像设置
            </h5>
        </div>
        <div class="card-body p-4">
            <div class="avatar-section">
                <div class="avatar-container">
                    <div class="avatar-display" id="avatarDisplay" onclick="showAvatarUploadModal()">
                        <!-- 头像图片会在这里动态加载 -->
                        <div class="avatar-placeholder" id="avatarPlaceholder"></div>
                        <img id="avatarImage" class="avatar-image" style="display: none;" alt="用户头像">
                    </div>
                    <div class="avatar-upload-btn" onclick="showAvatarUploadModal()" title="更换头像">
                        <i class="fas fa-camera"></i>
                    </div>
                </div>
                <div class="avatar-info">
                    <h5>设置个性化头像</h5>
                    <p>支持 JPG、PNG、GIF、WebP 格式，文件大小不超过 2MB</p>
                    <p class="mt-2"><small class="text-muted">点击头像或相机图标上传新头像</small></p>
                </div>
            </div>
        </div>
    </div>



    <div class="card shadow-sm border-0 rounded-lg mb-4">
        <div class="card-header bg-white border-bottom border-primary-subtle py-3">
            <h5 class="mb-0 text-primary">
                <i class="fas fa-user me-2"></i>基本信息
            </h5>
        </div>
        <div class="card-body p-4">
            <div class="profile-info row g-4">
                <!-- 真实姓名 -->
                <div class="info-item col-12 col-md-6">
                    <div class="d-flex align-items-center">
                        <span class="info-label fw-semibold text-secondary w-25">真实姓名</span>
                        <span class="info-value text-dark flex-grow-1" id="displayRealName" th:text="${user != null ? user.realName : '未设置'}">真实姓名</span>
                    </div>
                </div>
                <!-- 用户名 -->
                <div class="info-item col-12 col-md-6">
                    <div class="d-flex align-items-center">
                        <span class="info-label fw-semibold text-secondary w-25">用户名</span>
                        <span class="info-value text-dark flex-grow-1" id="displayUsername" th:text="${user != null ? user.username : '未设置'}">用户名</span>
                    </div>
                </div>
                <!-- 联系电话 -->
                <div class="info-item col-12 col-md-6">
                    <div class="d-flex align-items-center">
                        <span class="info-label fw-semibold text-secondary w-25">联系电话</span>
                        <span class="info-value text-dark flex-grow-1" id="displayPhone" th:text="${user != null ? user.phone : '未设置'}">联系电话</span>
                    </div>
                </div>
                <!-- 邮箱 -->
                <div class="info-item col-12 col-md-6">
                    <div class="d-flex align-items-center">
                        <span class="info-label fw-semibold text-secondary w-25">邮箱</span>
                        <span class="info-value text-dark flex-grow-1" id="displayEmail" th:text="${user != null ? user.email : '未设置'}">邮箱</span>
                    </div>
                </div>
                <!-- 生日 -->
                <div class="info-item col-12 col-md-6">
                    <div class="d-flex align-items-center">
                        <span class="info-label fw-semibold text-secondary w-25">生日</span>
                        <span class="info-value text-dark flex-grow-1" id="displayBirthDay" th:text="${user != null ? user.birthDay : '未设置'}">生日</span>
                    </div>
                </div>
            </div>
            <div class="btn-group mt-4">
                <button class="btn btn-primary-custom" onclick="showEditProfileModal()">
                    <i class="fas fa-edit me-1"></i>编辑个人信息
                </button>
            </div>
        </div>
    </div>

    <!-- 头像上传弹框 -->
    <div class="avatar-modal" id="avatarUploadModal">
        <div class="avatar-modal-content">
            <div class="avatar-modal-header">
                <h3 class="avatar-modal-title">
                    <i class="fas fa-camera me-2"></i>上传头像
                </h3>
                <button class="avatar-modal-close" onclick="closeAvatarUploadModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="avatar-modal-body">
                <!-- 文件上传区域 -->
                <div class="avatar-upload-area" id="avatarUploadArea">
                    <div class="avatar-upload-icon">
                        <i class="fas fa-cloud-upload-alt"></i>
                    </div>
                    <div class="avatar-upload-text">点击选择或拖拽图片到这里</div>
                    <div class="avatar-upload-hint">支持 JPG、PNG、GIF、WebP 格式，最大 2MB</div>
                </div>

                <!-- 隐藏的文件输入 -->
                <input type="file" id="avatarFileInput" class="avatar-file-input" accept="image/jpeg,image/png,image/gif,image/webp">

                <!-- 图片预览 -->
                <div class="avatar-preview" id="avatarPreview">
                    <img id="avatarPreviewImage" alt="预览图片">
                </div>

                <!-- 上传进度条 -->
                <div class="avatar-progress" id="avatarProgress">
                    <div class="avatar-progress-bar" id="avatarProgressBar"></div>
                </div>

                <!-- 错误信息 -->
                <div class="avatar-error-message" id="avatarErrorMessage"></div>

                <!-- 成功信息 -->
                <div class="avatar-success-message" id="avatarSuccessMessage"></div>
            </div>
            <div class="avatar-modal-footer">
                <button type="button" class="avatar-modal-btn avatar-modal-btn-secondary" onclick="closeAvatarUploadModal()">
                    取消
                </button>
                <button type="button" class="avatar-modal-btn avatar-modal-btn-primary" id="uploadAvatarBtn" onclick="uploadAvatar()" disabled>
                    <i class="fas fa-upload me-1"></i>上传头像
                </button>
            </div>
        </div>
    </div>
</div>



<!-- 个人信息编辑弹框 -->
<div class="profile-modal" id="editProfileModal">
    <div class="profile-modal-content">
        <div class="profile-modal-header">
            <h3 class="profile-modal-title">
                <i class="fas fa-user-edit me-2"></i>编辑个人信息
            </h3>
            <button class="profile-modal-close" onclick="closeEditProfileModal()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="profile-modal-body">
            <form id="profileEditForm">
                <div class="profile-form-row">
                    <div class="profile-form-col">
                        <div class="profile-form-group">
                            <label class="profile-form-label">真实姓名</label>
                            <input type="text" class="profile-form-control" id="editRealName"
                                   name="realName" required maxlength="50">
                            <div class="profile-error-message" id="realNameError"></div>
                        </div>
                    </div>
                    <div class="profile-form-col">
                        <div class="profile-form-group">
                            <label class="profile-form-label">用户名</label>
                            <input type="text" class="profile-form-control" id="editUsername"
                                   name="username" disabled>
                            <div class="form-text small text-muted mt-1">用户名不可修改</div>
                        </div>
                    </div>
                </div>

                <div class="profile-form-row">
                    <div class="profile-form-col">
                        <div class="profile-form-group">
                            <label class="profile-form-label">联系电话</label>
                            <input type="tel" class="profile-form-control" id="editPhone"
                                   name="phone" required pattern="[0-9]{11}" maxlength="11">
                            <div class="profile-error-message" id="phoneError"></div>
                            <div class="form-text small text-muted mt-1">请输入11位手机号码</div>
                        </div>
                    </div>
                    <div class="profile-form-col">
                        <div class="profile-form-group">
                            <label class="profile-form-label">邮箱地址</label>
                            <input type="email" class="profile-form-control" id="editEmail"
                                   name="email" required maxlength="100">
                            <div class="profile-error-message" id="emailError"></div>
                        </div>
                    </div>
                </div>

                <div class="profile-form-row">
                    <div class="profile-form-col">
                        <div class="profile-form-group">
                            <label class="profile-form-label">生日</label>
                            <input type="date" class="profile-form-control" id="editBirthDay"

<script>
    // 侧边栏折叠/展开
    // 侧边栏折叠/展开（修复toggleIcon不存在的问题）
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('mainContent');
        // 增加空值判断，避免元素不存在时报错
        const toggleIcon = document.getElementById('toggleIcon');

        if (sidebar && mainContent) {
            sidebar.classList.toggle('collapsed');
            mainContent.classList.toggle('full-width');

            if (toggleIcon) { // 只在元素存在时执行
                if (sidebar.classList.contains('collapsed')) {
                    toggleIcon.classList.remove('fa-angles-left');
                    toggleIcon.classList.add('fa-angles-right');
                } else {
                    toggleIcon.classList.remove('fa-angles-right');
                    toggleIcon.classList.add('fa-angles-left');
                }
            }
        }
    }

    // 子菜单折叠/展开
    function toggleSubmenu(menuId, linkElement) {
        const submenu = document.getElementById(menuId);
        const link = linkElement;

        if (!submenu || !link) return; // 空值保护

        // 关闭其他已展开的子菜单
        document.querySelectorAll('.submenu.show').forEach(menu => {
            if (menu.id !== menuId) {
                menu.classList.remove('show');
                menu.previousElementSibling.classList.remove('expanded');
            }
        });

        submenu.classList.toggle('show');
        link.classList.toggle('expanded');
    }

    // 显示编辑个人信息弹框（核心修复）
    function showEditProfileModal() {
        try {
            console.log("显示编辑弹框");

            // 获取当前显示的用户信息（增加空值保护）
            const displayRealName = document.getElementById('displayRealName');
            const displayUsername = document.getElementById('displayUsername');
            const displayPhone = document.getElementById('displayPhone');
            const displayEmail = document.getElementById('displayEmail');
            const displayBirthDay = document.getElementById('displayBirthDay');

            // 空值判断，避免获取不存在的元素属性
            const realName = displayRealName ? displayRealName.textContent.trim() : '';
            const username = displayUsername ? displayUsername.textContent.trim() : '';
            const phone = displayPhone ? displayPhone.textContent.trim() : '';
            const email = displayEmail ? displayEmail.textContent.trim() : '';
            const birthDay = displayBirthDay ? displayBirthDay.textContent.trim() : '';

            // 填充表单数据（增加元素存在性检查）
            const editRealName = document.getElementById('editRealName');
            const editUsername = document.getElementById('editUsername');
            const editPhone = document.getElementById('editPhone');
            const editEmail = document.getElementById('editEmail');
            const editBirthDay = document.getElementById('editBirthDay');

            if (editRealName) editRealName.value = realName;
            if (editUsername) editUsername.value = username;
            if (editPhone) editPhone.value = phone;
            if (editEmail) editEmail.value = email;

            // 关键修复：处理日期格式和"未设置"的情况
            if (editBirthDay) {
                // 只在生日是有效日期格式时赋值，否则置空
                if (birthDay && birthDay !== '未设置' && /^\d{4}-\d{2}-\d{2}$/.test(birthDay)) {
                    editBirthDay.value = birthDay;
                } else {
                    editBirthDay.value = '';

            }

            // 清除之前的错误信息
            clearErrorMessages();

            // 显示弹框（增加元素存在性检查）
            const modal = document.getElementById('editProfileModal');
            if (modal) {
                modal.style.display = 'block';

    // 关闭编辑个人信息弹框（增加错误捕获）
    function closeEditProfileModal() {
        try {
            console.log("关闭编辑弹框");

                modal.style.display = 'none';

    // 清除所有错误信息
    function clearErrorMessages() {
        const errorElements = document.querySelectorAll('.profile-error-message');
        errorElements.forEach(element => {
            element.textContent = '';
            element.classList.remove('show');
        });
    }

    // 显示错误信息
    function showError(elementId, message) {
        const errorElement = document.getElementById(elementId);
        if (errorElement) { // 增加空值判断
            errorElement.textContent = message;
            errorElement.classList.add('show');
        }
    }

    // 表单验证（保持不变）
    function validateForm() {
        let isValid = true;
        clearErrorMessages();

        // 验证真实姓名
        const realNameInput = document.getElementById('editRealName');
        const realName = realNameInput ? realNameInput.value.trim() : '';
        if (!realName) {
            showError('realNameError', '请输入真实姓名');
            isValid = false;
        } else if (realName.length > 50) {
            showError('realNameError', '姓名不能超过50个字符');
            isValid = false;
        }

        // 验证手机号
        const phoneInput = document.getElementById('editPhone');
        const phone = phoneInput ? phoneInput.value.trim() : '';
        const phoneRegex = /^1[3-9]\d{9}$/;
        if (!phone) {
            showError('phoneError', '请输入手机号码');
            isValid = false;
        } else if (!phoneRegex.test(phone)) {
            showError('phoneError', '请输入有效的11位手机号码');
            isValid = false;
        }

        // 验证邮箱
        const emailInput = document.getElementById('editEmail');
        const email = emailInput ? emailInput.value.trim() : '';
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!email) {
            showError('emailError', '请输入邮箱地址');
            isValid = false;
        } else if (!emailRegex.test(email)) {
            showError('emailError', '请输入有效的邮箱地址');
            isValid = false;
        } else if (email.length > 100) {
            showError('emailError', '邮箱地址不能超过100个字符');
            isValid = false;
        }

        // 验证生日（可选）
        const birthDayInput = document.getElementById('editBirthDay');
        const birthDay = birthDayInput ? birthDayInput.value : '';
        if (birthDay) {
            const birthDate = new Date(birthDay);
            const today = new Date();
            if (birthDate > today) {
                showError('birthDayError', '生日不能晚于今天');
                isValid = false;
            }
        }

        return isValid;
    }

    // 保存个人信息更改（增加错误捕获）
    function saveProfileChanges() {
        try {
            console.log("保存个人信息");

            // 验证表单
            if (!validateForm()) {
                return;
            }

            // 获取表单数据（增加空值保护）
            const editRealName = document.getElementById('editRealName');
            const editPhone = document.getElementById('editPhone');
            const editEmail = document.getElementById('editEmail');
            const editBirthDay = document.getElementById('editBirthDay');

            const formData = {
                realName: editRealName ? editRealName.value.trim() : '',
                phone: editPhone ? editPhone.value.trim() : '',
                email: editEmail ? editEmail.value.trim() : '',
                birthDay: editBirthDay ? editBirthDay.value : ''
            };

            console.log("提交的数据:", formData);

            // 显示加载状态
            const saveBtn = document.querySelector('.profile-modal-btn-primary');
            if (!saveBtn) return;

            const originalText = saveBtn.innerHTML;
            saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>保存中...';
            saveBtn.disabled = true;

            // 清除之前的提示信息
            clearErrorMessages();
            const submitSuccess = document.getElementById('submitSuccess');
            const submitError = document.getElementById('submitError');
            if (submitSuccess) submitSuccess.classList.remove('show');
            if (submitError) submitError.classList.remove('show');

            // 发送AJAX请求到后端
            fetch('/patient/profile/update-ajax', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'X-Requested-With': 'XMLHttpRequest'
                },
                body: new URLSearchParams(formData).toString()
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('网络响应异常，状态码：' + response.status);
                    }
                    return response.json();
                })
                .then(data => {
                    console.log("服务器响应:", data);

                    if (data.success) {
                        // 更新页面显示的信息
                        const displayRealName = document.getElementById('displayRealName');
                        const displayPhone = document.getElementById('displayPhone');
                        const displayEmail = document.getElementById('displayEmail');
                        const displayBirthDay = document.getElementById('displayBirthDay');

                        if (displayRealName) displayRealName.textContent = formData.realName;
                        if (displayPhone) displayPhone.textContent = formData.phone;
                        if (displayEmail) displayEmail.textContent = formData.email;
                        if (displayBirthDay) displayBirthDay.textContent = formData.birthDay || '未设置';

                        // 显示成功信息
                        if (submitSuccess) {
                            submitSuccess.textContent = data.message || '个人信息更新成功！';
                            submitSuccess.classList.add('show');
                        }

                        // 3秒后自动关闭弹框
                        setTimeout(() => {
                            closeEditProfileModal();
                        }, 3000);
                    } else {
                        // 显示错误信息
                        if (submitError) {
                            submitError.textContent = data.message || '更新失败，请重试';
                            submitError.classList.add('show');
                        }

                        // 如果有字段级错误，显示在对应字段下
                        if (data.fieldErrors) {
                            Object.keys(data.fieldErrors).forEach(field => {
                                const errorId = field + 'Error';
                                const errorElement = document.getElementById(errorId);
                                if (errorElement) {
                                    errorElement.textContent = data.fieldErrors[field];
                                    errorElement.classList.add('show');
                                }
                            });
                        }

                        // 恢复按钮状态
                        saveBtn.innerHTML = originalText;
                        saveBtn.disabled = false;
                    }
                })
                .catch(error => {
                    console.error('更新失败:', error);

                    // 显示错误信息
                    if (submitError) {
                        submitError.textContent = '网络错误或服务器异常，请稍后重试';
                        submitError.classList.add('show');
                    }

                    // 恢复按钮状态
                    saveBtn.innerHTML = originalText;
                    saveBtn.disabled = false;
                });
        } catch (error) {
            console.error("保存信息出错：", error);
            alert("保存失败，请刷新页面重试");

            // 恢复按钮状态
            const saveBtn = document.querySelector('.profile-modal-btn-primary');
            if (saveBtn) {
                saveBtn.innerHTML = '<i class="fas fa-save me-1"></i>保存更改';
                saveBtn.disabled = false;
            }
        }
    }

    // 绑定拖拽事件
    function bindDragAndDropEvents() {
        console.log("绑定拖拽事件 - 开始");

        const uploadArea = document.getElementById('avatarUploadArea');
        const fileInput = document.getElementById('avatarFileInput');

        console.log("uploadArea:", uploadArea);
        console.log("fileInput:", fileInput);

        if (!uploadArea || !fileInput) {
            console.error("上传区域或文件输入元素不存在！");
            return;
        }

        // 点击上传区域触发文件选择
        uploadArea.addEventListener('click', function(e) {
            console.log("点击上传区域");
            if (e.target !== fileInput) {
                console.log("触发文件选择");
                fileInput.click();
            }
        });

        // 文件选择变化事件
        fileInput.addEventListener('change', function(e) {
            console.log("文件选择变化");
            if (e.target.files && e.target.files[0]) {
                console.log("已选择文件:", e.target.files[0].name);
                handleFileSelect(e.target.files[0]);
            }
        });

        // 拖拽事件
        uploadArea.addEventListener('dragover', function(e) {
            e.preventDefault();
            e.stopPropagation();
            uploadArea.classList.add('drag-over');
        });

        uploadArea.addEventListener('dragleave', function(e) {
            e.preventDefault();
            e.stopPropagation();
            uploadArea.classList.remove('drag-over');
        });

        uploadArea.addEventListener('drop', function(e) {
            e.preventDefault();
            e.stopPropagation();
            uploadArea.classList.remove('drag-over');

            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                console.log("拖拽文件:", e.dataTransfer.files[0].name);
                handleFileSelect(e.dataTransfer.files[0]);
            }
        });

        console.log("拖拽事件绑定完成");
    }

    // 处理文件选择
    function handleFileSelect(file) {
        console.log("选择的文件：", file);

        // 验证文件类型
        const validTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];
        if (!validTypes.includes(file.type)) {
            showAvatarError('请选择有效的图片格式（JPG、PNG、GIF、WebP）');
            return;
        }

        // 验证文件大小（2MB）
        const maxSize = 2 * 1024 * 1024; // 2MB
        if (file.size > maxSize) {
        if (file.size > maxSize) {
            showAvatarError('文件大小不能超过2MB');
            return;
        }

        selectedFile = file;

        // 创建预览
        if (avatarPreviewUrl) {
            URL.revokeObjectURL(avatarPreviewUrl);
        }

        avatarPreviewUrl = URL.createObjectURL(file);

        // 显示预览
        const previewImage = document.getElementById('avatarPreviewImage');
        const previewContainer = document.getElementById('avatarPreview');
        previewImage.src = avatarPreviewUrl;
        previewContainer.style.display = 'block';

        // 启用上传按钮
        document.getElementById('uploadAvatarBtn').disabled = false;

        // 隐藏错误信息
        document.getElementById('avatarErrorMessage').style.display = 'none';
    }

    // 上传头像
    function uploadAvatar() {
        if (!selectedFile) {
            showAvatarError('请先选择图片');
            return;
        }

        // 显示进度条
        const progressBar = document.getElementById('avatarProgressBar');
        const progressContainer = document.getElementById('avatarProgress');
        progressContainer.style.display = 'block';
        progressBar.style.width = '0%';

        // 禁用上传按钮
        const uploadBtn = document.getElementById('uploadAvatarBtn');
        uploadBtn.disabled = true;
        uploadBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>上传中...';

        // 创建FormData
        const formData = new FormData();
        formData.append('avatar', selectedFile);

        // 模拟进度（实际进度需要后端支持或使用XMLHttpRequest）
        let progress = 0;
        const progressInterval = setInterval(() => {
            progress += 10;
            if (progress > 90) {
                clearInterval(progressInterval);
            }
            progressBar.style.width = progress + '%';
        }, 100);

        // 发送上传请求
        fetch('/patient/avatar/upload', {
            method: 'POST',
            body: formData
        })
            .then(response => response.json())
            .then(data => {
                clearInterval(progressInterval);
                progressBar.style.width = '100%';

                if (data.success) {
                    showAvatarSuccess('头像上传成功！');

                    // 更新页面头像显示
                    const avatarImage = document.getElementById('avatarImage');
                    const avatarPlaceholder = document.getElementById('avatarPlaceholder');

                    // 使用新的URL，避免缓存问题
                    avatarImage.src = data.avatarUrl + '?t=' + new Date().getTime();
                    avatarImage.style.display = 'block';
                    avatarPlaceholder.style.display = 'none';

                    // 更新侧边栏头像
                    updateSidebarAvatar({
                        hasAvatar: true,
                        avatarUrl: data.avatarUrl,
                        defaultAvatar: data.defaultAvatar || '用户'
                    });

                    // 3秒后关闭弹框
                    setTimeout(() => {
                        closeAvatarUploadModal();
                    }, 3000);
                } else {
                    showAvatarError('上传失败：' + data.message);
                    uploadBtn.disabled = false;
                    uploadBtn.innerHTML = '<i class="fas fa-upload me-1"></i>上传头像';
                }
            })
            .catch(error => {
                clearInterval(progressInterval);
                console.error('上传出错：', error);
                showAvatarError('上传失败：网络错误');
                uploadBtn.disabled = false;
                uploadBtn.innerHTML = '<i class="fas fa-upload me-1"></i>上传头像';
            });
    }

    // 更新侧边栏头像（完整版）
    function updateSidebarAvatar(data) {
        console.log("更新侧边栏头像：", data);

        const sidebarAvatarPlaceholder = document.getElementById('sidebarAvatarPlaceholder');
        const sidebarAvatarImage = document.getElementById('sidebarAvatarImage');

        if (!sidebarAvatarPlaceholder || !sidebarAvatarImage) {
            console.error("侧边栏头像元素不存在");
            return;
        }

        if (data.hasAvatar && data.avatarUrl) {
            console.log("设置侧边栏头像图片：", data.avatarUrl);
            // 有头像，显示图片
            // 添加时间戳防止缓存
            sidebarAvatarImage.src = data.avatarUrl + '?t=' + new Date().getTime();
            sidebarAvatarImage.style.display = 'block';
            sidebarAvatarPlaceholder.style.display = 'none';
            sidebarAvatarPlaceholder.textContent = '';

            // 确保图片加载
            sidebarAvatarImage.onload = function() {
                console.log("侧边栏头像图片加载成功");
            };
            sidebarAvatarImage.onerror = function() {
                console.error("侧边栏头像图片加载失败，显示默认头像");
                sidebarAvatarImage.style.display = 'none';
                sidebarAvatarPlaceholder.style.display = 'flex';
                sidebarAvatarPlaceholder.textContent = data.defaultAvatar || '用户';
                sidebarAvatarPlaceholder.style.cssText = `
                display: flex;
                align-items: center;
                justify-content: center;
                width: 40px;
                height: 40px;
                border-radius: 50%;
                background: linear-gradient(135deg, #36B37E 0%, #00A3BF 100%);
                color: white;
                font-weight: bold;
                font-size: 18px;
            `;
            };
        } else {
            console.log("设置侧边栏默认头像");
            // 没有头像，显示姓名首字母
            sidebarAvatarImage.style.display = 'none';
            sidebarAvatarPlaceholder.style.display = 'flex';
            sidebarAvatarPlaceholder.textContent = data.defaultAvatar || '用户';
            sidebarAvatarPlaceholder.style.cssText = `
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #36B37E 0%, #00A3BF 100%);
            color: white;
            font-weight: bold;
            font-size: 18px;
        `;
        }
    }

    // 点击弹框外部关闭
    window.onclick = function(event) {
        const editModal = document.getElementById('editProfileModal');
        const avatarModal = document.getElementById('avatarUploadModal');

        if (editModal && event.target === editModal) {
            closeEditProfileModal();
        }

        if (avatarModal && event.target === avatarModal) {
            closeAvatarUploadModal();
        }
    }

    // 按ESC键关闭弹框
    document.addEventListener('DOMContentLoaded', function() {
        console.log("个人信息管理页面加载完成");

        // 检查关键元素
        const editBtn = document.querySelector('.btn-primary-custom[onclick="showEditProfileModal()"]');
        if (!editBtn) {
            console.error("编辑按钮元素不存在");
        }

        const editModal = document.getElementById('editProfileModal');
        if (!editModal) {
            console.error("编辑弹框元素不存在");
        }

        const avatarModal = document.getElementById('avatarUploadModal');
        if (!avatarModal) {
            console.error("头像上传弹框元素不存在");
        }

        // 加载用户头像和侧边栏信息
        loadUserAvatar();

        // 初始化侧边栏用户信息
        const displayRealName = document.getElementById('displayRealName');
        const sidebarUserName = document.getElementById('sidebarUserName');

        if (displayRealName && sidebarUserName) {
            const realName = displayRealName.textContent.trim();
            if (realName && realName !== '未设置') {
                sidebarUserName.textContent = realName;
            }
        }
    });
    // 显示头像上传弹框（由用户点击触发）
    function showAvatarUploadModal() {
        console.log("用户点击头像，显示上传弹框");

        try {
            // 重置状态
            selectedFile = null;
            avatarPreviewUrl = null;

            // 隐藏预览
            const preview = document.getElementById('avatarPreview');
            const progress = document.getElementById('avatarProgress');
            const errorMsg = document.getElementById('avatarErrorMessage');
            const successMsg = document.getElementById('avatarSuccessMessage');

            if (preview) preview.style.display = 'none';
            if (progress) progress.style.display = 'none';
            if (errorMsg) errorMsg.style.display = 'none';
            if (successMsg) successMsg.style.display = 'none';

            // 禁用上传按钮
            const uploadBtn = document.getElementById('uploadAvatarBtn');
            if (uploadBtn) uploadBtn.disabled = true;

            // 显示弹框
            const modal = document.getElementById('avatarUploadModal');
            if (modal) {
                modal.style.display = 'block';
                document.body.style.overflow = 'hidden';

                // 绑定拖拽事件
                setTimeout(() => {
                    bindDragAndDropEvents();
                }, 100);
            } else {
                console.error("头像上传弹框元素不存在！");
                alert("头像上传功能加载失败，请刷新页面");
            }
        } catch (error) {
            console.error("显示头像上传弹框出错：", error);
            alert("头像上传功能出错，请刷新页面");
        }
    }

    // 关闭头像上传弹框
    function closeAvatarUploadModal() {
        console.log("关闭头像上传弹框");
        const modal = document.getElementById('avatarUploadModal');
        if (modal) {
            modal.style.display = 'none';
            document.body.style.overflow = '';
        }

        // 清理预览URL
        if (avatarPreviewUrl) {
            URL.revokeObjectURL(avatarPreviewUrl);
            avatarPreviewUrl = null;
        }
    }

</script>
</body>
</html>
