<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>设置提醒 - 医疗健康管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 移除CSRF元标签，因为可能未启用CSRF保护 -->
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/patient/dashboard">医疗健康管理系统</a>
        <div class="navbar-nav ms-auto">
            <span class="navbar-text me-3" th:text="'欢迎，' + (${user != null ? user.realName : ''})"></span>
            <a class="nav-link" href="/patient/logout">退出登录</a>
        </div>
    </div>
</nav>

<div class="container-fluid mt-4">
<!--    <div class="row">-->
<!--        &lt;!&ndash; 侧边栏 &ndash;&gt;-->
<!--        <div class="col-md-2">-->
<!--            <div class="list-group">-->
<!--                <a href="/patient/dashboard" class="list-group-item list-group-item-action">病人主页</a>-->
<!--                <a href="/patient/profile" class="list-group-item list-group-item-action">个人信息</a>-->
<!--                <a href="/patient/medical-records" class="list-group-item list-group-item-action">电子病历</a>-->
<!--                <a href="/patient/appointments/book" class="list-group-item list-group-item-action">预约挂号</a>-->
<!--                <a href="/patient/appointment-management" class="list-group-item list-group-item-action active">预约管理</a>-->
<!--                <a href="/patient/appointments" class="list-group-item list-group-item-action">我的预约</a>-->
<!--                <a href="/patient/schedules" class="list-group-item list-group-item-action">医生排班查询</a>-->
<!--                <a href="/patient/health-profile" class="list-group-item list-group-item-action">健康档案</a>-->
<!--            </div>-->
<!--        </div>-->

        <!-- 主内容区 -->
        <div class="col-md-10">
            <div class="card">
                <div class="card-header">
                    <h4>设置提醒 - [[${appointment?.doctorName}]]</h4>
                </div>
                <div class="card-body">
                    <!-- 预约信息 -->
                    <div class="mb-4">
                        <h5>预约详情</h5>
                        <table class="table table-bordered">
                            <tr>
                                <td><strong>预约日期</strong></td>
                                <td th:text="${appointment?.appointmentDate != null ? #temporals.format(appointment.appointmentDate, 'yyyy-MM-dd') : '无'}"></td>
                                <td><strong>时间段</strong></td>
                                <td th:text="${appointment?.timeSlot}"></td>
                            </tr>
                            <tr>
                                <td><strong>医生</strong></td>
                                <td th:text="${appointment?.doctorName}"></td>
                                <td><strong>科室</strong></td>
                                <td th:text="${appointment?.departmentName}"></td>
                            </tr>
                            <tr>
                                <td><strong>状态</strong></td>
                                <td>
                                    <span th:if="${appointment?.status == '待确认'}" class="badge bg-warning">待确认</span>
                                    <span th:if="${appointment?.status == '已确认'}" class="badge bg-success">已确认</span>
                                    <span th:if="${appointment?.status == '已拒绝'}" class="badge bg-danger">已拒绝</span>
                                    <span th:if="${appointment?.status == '已完成'}" class="badge bg-info">已完成</span>
                                    <span th:if="${appointment?.status == '已取消'}" class="badge bg-secondary">已取消</span>
                                </td>
                                <td><strong>预约时间</strong></td>
                                <td th:text="${appointment?.appointmentTime != null ? #temporals.format(appointment.appointmentTime, 'yyyy-MM-dd HH:mm:ss') : '无'}"></td>
                            </tr>
                        </table>
                    </div>

                    <!-- 提醒设置表单 -->
                    <form th:action="@{/patient/appointments/set-reminder/{id}(id=${appointment.id})}" method="post" id="reminderForm">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="reminderTimeOffset" class="form-label">提醒时间设置</label>
                                    <select class="form-select" id="reminderTimeOffset" name="reminderTimeOffset" required>
                                        <option value="-120" selected>就诊前2小时提醒</option>
                                        <option value="-60">就诊前1小时提醒</option>
                                        <option value="-30">就诊前30分钟提醒</option>
                                        <option value="-240">就诊前4小时提醒</option>
                                        <option value="-1440">就诊前1天提醒</option>
                                    </select>
                                    <div class="form-text">选择在预约时间前多长时间提醒您</div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="reminderMethods" class="form-label">提醒方式</label>
                                    <select class="form-select" id="reminderMethods" name="reminderMethods" required>
                                        <option value="站内信" selected>站内信</option>
                                        <option value="短信">短信</option>
                                        <option value="邮件">邮件</option>
                                        <option value="站内信,短信">站内信+短信</option>
                                        <option value="站内信,邮件">站内信+邮件</option>
                                        <option value="短信,邮件">短信+邮件</option>
                                        <option value="站内信,短信,邮件">站内信+短信+邮件</option>
                                    </select>
                                    <div class="form-text">选择您希望接收提醒的方式</div>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <button type="submit" class="btn btn-primary">设置提醒</button>
                            <a href="/patient/appointments" class="btn btn-secondary">返回</a>
                        </div>
                    </form>

                    <!-- 如果已设置提醒，显示编辑/取消选项 -->
                    <div th:if="${appointment?.reminderEnabled == 1}" class="mt-4">
                        <h5>已设置的提醒</h5>
                        <div class="alert alert-info">
                            <p><strong>提醒时间：</strong>
                                <span th:if="${appointment.reminderTimeOffset == -120}">就诊前2小时</span>
                                <span th:if="${appointment.reminderTimeOffset == -60}">就诊前1小时</span>
                                <span th:if="${appointment.reminderTimeOffset == -30}">就诊前30分钟</span>
                                <span th:if="${appointment.reminderTimeOffset == -240}">就诊前4小时</span>
                                <span th:if="${appointment.reminderTimeOffset == -1440}">就诊前1天</span>
                                <span th:unless="${appointment.reminderTimeOffset == -120 or appointment.reminderTimeOffset == -60 or appointment.reminderTimeOffset == -30 or appointment.reminderTimeOffset == -240 or appointment.reminderTimeOffset == -1440}" th:text="${appointment.reminderTimeOffset > 0 ? '就诊后' + (appointment.reminderTimeOffset) + '分钟' : '就诊前' + (-appointment.reminderTimeOffset) + '分钟'}"></span>
                            </p>
                            <p><strong>提醒方式：</strong><span th:text="${appointment.reminderMethods}"></span></p>
                        </div>

                        <div class="d-flex gap-2">
                            <!-- 编辑提醒表单 -->
                            <form th:action="@{/patient/appointments/edit-reminder/{id}(id=${appointment.id})}" method="post" class="d-inline" id="editReminderForm">
                                <div class="row">
                                    <div class="col-md-4">
                                        <select class="form-select" name="reminderTimeOffset" required>
                                            <option value="-120" th:selected="${appointment.reminderTimeOffset == -120}">就诊前2小时</option>
                                            <option value="-60" th:selected="${appointment.reminderTimeOffset == -60}">就诊前1小时</option>
                                            <option value="-30" th:selected="${appointment.reminderTimeOffset == -30}">就诊前30分钟</option>
                                            <option value="-240" th:selected="${appointment.reminderTimeOffset == -240}">就诊前4小时</option>
                                            <option value="-1440" th:selected="${appointment.reminderTimeOffset == -1440}">就诊前1天</option>
                                        </select>
                                    </div>
                                    <div class="col-md-4">
                                        <select class="form-select" name="reminderMethods" required>
                                            <option value="站内信" th:selected="${appointment.reminderMethods == '站内信'}">站内信</option>
                                            <option value="短信" th:selected="${appointment.reminderMethods == '短信'}">短信</option>
                                            <option value="邮件" th:selected="${appointment.reminderMethods == '邮件'}">邮件</option>
                                            <option value="站内信,短信" th:selected="${appointment.reminderMethods == '站内信,短信'}">站内信+短信</option>
                                            <option value="站内信,邮件" th:selected="${appointment.reminderMethods == '站内信,邮件'}">站内信+邮件</option>
                                            <option value="短信,邮件" th:selected="${appointment.reminderMethods == '短信,邮件'}">短信+邮件</option>
                                            <option value="站内信,短信,邮件" th:selected="${appointment.reminderMethods == '站内信,短信,邮件'}">站内信+短信+邮件</option>
                                        </select>
                                    </div>
                                    <div class="col-md-4">
                                        <button type="submit" class="btn btn-warning">编辑提醒</button>
                                    </div>
                                </div>
                            </form>

                            <!-- 取消提醒表单（仅修改这里，添加ID并绑定异步事件） -->
                            <form th:action="@{/patient/appointments/cancel-reminder/{id}(id=${appointment.id})}" method="post" class="d-inline" id="cancelReminderForm">
                                <button type="submit" class="btn btn-danger">取消提醒</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // 通用CSRF Token获取方法
    const getCsrfToken = () => {
        const cookies = document.cookie.split('; ');
        for (const cookie of cookies) {
            const [name, value] = cookie.split('=');
            if (name.trim() === 'XSRF-TOKEN') { // Spring Security 默认 Cookie 名
                return value;
            }
        }
        return null; // 如果没有找到token，返回null
    };

    document.getElementById('reminderForm').addEventListener('submit', function(e) {
        e.preventDefault(); // 阻止默认提交

        // 获取表单数据
        const formData = new FormData(this);
        const reminderTimeOffset = formData.get('reminderTimeOffset');
        const reminderMethods = formData.get('reminderMethods');
        const appointmentId = this.action.match(/\/(\d+)$/)[1]; // 从action URL中提取ID

        const csrfToken = getCsrfToken();
        const headers = {
            'Content-Type': 'application/x-www-form-urlencoded'
        };
        
        // 只有在找到CSRF token时才添加到请求头
        if (csrfToken) {
            headers['X-XSRF-TOKEN'] = csrfToken;
        }

        fetch('/patient/appointments/set-reminder/' + appointmentId, {
            method: 'POST',
            headers: headers,
            body: 'reminderTimeOffset=' + reminderTimeOffset + '&reminderMethods=' + encodeURIComponent(reminderMethods)
        }).then(response => {
            return response.json();
        }).then(data => {
            alert(data.msg);
            if(data.msg.includes('成功')) {
                location.reload(); // 重新加载页面以显示更新后的提醒设置
            }
        }).catch(error => {
            alert('设置提醒失败：网络异常');
            console.error('设置提醒异常：', error);
        });
    });

    // 编辑提醒表单提交
    document.getElementById('editReminderForm').addEventListener('submit', function(e) {
        e.preventDefault(); // 阻止默认提交

        // 获取表单数据
        const formData = new FormData(this);
        const reminderTimeOffset = formData.get('reminderTimeOffset');
        const reminderMethods = formData.get('reminderMethods');
        const appointmentId = this.action.match(/\/(\d+)$/)[1]; // 从action URL中提取ID

        const csrfToken = getCsrfToken();
        const headers = {
            'Content-Type': 'application/x-www-form-urlencoded'
        };
        
        // 只有在找到CSRF token时才添加到请求头
        if (csrfToken) {
            headers['X-XSRF-TOKEN'] = csrfToken;
        }

        fetch('/patient/appointments/edit-reminder/' + appointmentId, {
            method: 'POST',
            headers: headers,
            body: 'reminderTimeOffset=' + reminderTimeOffset + '&reminderMethods=' + encodeURIComponent(reminderMethods)
        }).then(response => {
            return response.json();
        }).then(data => {
            alert(data.msg);
            if(data.msg.includes('成功')) {
                location.reload(); // 重新加载页面以显示更新后的提醒设置
            }
        }).catch(error => {
            alert('编辑提醒失败：网络异常');
            console.error('编辑提醒异常：', error);
        });
    });

    // 新增：取消提醒的异步提交逻辑（核心修改）
    document.getElementById('cancelReminderForm').addEventListener('submit', function(e) {
        // 1. 阻止默认表单提交（避免跳转）
        e.preventDefault();

        // 2. 二次确认
        if(!confirm('确定要取消提醒吗？')) return;

        // 3. 提取预约ID
        const appointmentId = this.action.match(/\/(\d+)$/)[1];

        const csrfToken = getCsrfToken();
        const headers = {
            'Content-Type': 'application/x-www-form-urlencoded'
        };
        
        // 只有在找到CSRF token时才添加到请求头
        if (csrfToken) {
            headers['X-XSRF-TOKEN'] = csrfToken;
        }

        // 4. 异步提交取消请求
        fetch('/patient/appointments/cancel-reminder/' + appointmentId, {
            method: 'POST',
            headers: headers
        }).then(response => response.json())
            .then(data => {
                // 5. 仅弹窗提示，不刷新、不跳转、不修改界面
                alert(data.msg || '取消提醒成功！');
                // 无任何刷新/跳转操作，直接结束
            }).catch(error => {
            alert('取消提醒失败：网络异常');
            console.error('取消提醒异常：', error);
        });
    });
</script>
</body>
</html>
