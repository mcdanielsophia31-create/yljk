<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>诊断记录 - 医疗健康管理系统</title>
    <!-- 引入Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入Font Awesome图标 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* 统一的渐变背景 */
        body {
            background: linear-gradient(135deg, #36B37E, #00A3BF);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 侧边栏样式 */
        .sidebar {
            background: linear-gradient(to bottom, #36B37E, #00A3BF);
            color: white;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            padding-top: 20px;
            overflow-y: auto;
            box-shadow: 3px 0 10px rgba(0,0,0,0.1);
            z-index: 100;
        }

        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.8);
            padding: 12px 20px;
            margin: 5px 15px;
            border-radius: 8px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar .nav-link:hover {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            transform: translateX(5px);
        }

        .sidebar .nav-link.active {
            background: rgba(255, 255, 255, 0.3);
            color: white;
            font-weight: 500;
        }

        .sidebar .nav-link i {
            width: 20px;
            text-align: center;
        }

        .sidebar-header {
            text-align: center;
            padding: 20px;
            margin-bottom: 30px;
        }

        .sidebar-header h4 {
            color: white;
            margin: 0;
            font-weight: 600;
        }

        .user-info {
            padding: 0 20px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            margin-top: 20px;
        }

        .user-info p {
            color: rgba(255, 255, 255, 0.9);
            margin: 5px 0;
            font-size: 0.9em;
        }

        /* 主内容区域 */
        .main-content {
            margin-left: 250px;
            padding: 20px;
            min-height: 100vh;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            margin: 0;
            color: #2D3748;
            font-weight: 600;
        }

        .header .user-greeting {
            color: #4A5568;
            font-weight: 500;
        }

        /* 卡片样式 */
        .content-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .card-title {
            color: #2D3748;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #E2E8F0;
        }

        /* 表格样式 */
        .table {
            margin-bottom: 0;
        }

        .table th {
            background: #F7FAFC;
            color: #2D3748;
            font-weight: 600;
            border-top: none;
        }

        .table td {
            vertical-align: middle;
        }

        .table-striped tbody tr:nth-of-type(odd) {
            background-color: #F8F9FA;
        }

        .table-striped tbody tr:hover {
            background-color: #E6FFFA;
        }

        .badge {
            font-size: 0.75em;
        }

        .btn {
            border-radius: 8px;
            padding: 8px 16px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .sidebar {
                width: 70px;
            }
            .sidebar .nav-link span {
                display: none;
            }
            .sidebar .nav-link {
                justify-content: center;
                padding: 15px;
            }
            .main-content {
                margin-left: 70px;
            }
            .header {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <!-- 侧边栏 -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h4><i class="fas fa-clinic-medical"></i> 医疗系统</h4>
        </div>
        
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link" href="/patient/dashboard">
                    <i class="fas fa-home"></i>
                    <span>我的主页</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/patient/profile">
                    <i class="fas fa-user"></i>
                    <span>个人信息管理</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/patient/medical-records">
                    <i class="fas fa-file-medical"></i>
                    <span>电子病历</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" href="/patient/diagnoses">
                    <i class="fas fa-stethoscope"></i>
                    <span>诊断记录</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/patient/examinations">
                    <i class="fas fa-x-ray"></i>
                    <span>检查报告</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/patient/medications">
                    <i class="fas fa-pills"></i>
                    <span>用药历史</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/patient/appointments">
                    <i class="fas fa-calendar-check"></i>
                    <span>我的预约</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/patient/health-profile">
                    <i class="fas fa-heartbeat"></i>
                    <span>健康档案</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/patient/schedules">
                    <i class="fas fa-calendar-alt"></i>
                    <span>医生排班</span>
                </a>
            </li>
        </ul>
        
        <div class="user-info">
            <p><i class="fas fa-user"></i> <span th:text="${user.realName}"></span></p>
            <p><i class="fas fa-id-card"></i> <span th:text="${user.userId}"></span></p>
            <a href="/patient/logout" class="btn btn-outline-light btn-sm w-100 mt-2">
                <i class="fas fa-sign-out-alt"></i> 退出登录
            </a>
        </div>
    </div>

    <!-- 主内容区域 -->
    <div class="main-content">
        <div class="header">
            <h2><i class="fas fa-stethoscope me-2"></i>诊断记录</h2>
            <div class="user-greeting">
                <i class="fas fa-user me-1"></i>
                <span th:text="'欢迎，' + ${user.realName}"></span>
            </div>
        </div>
        
        <div class="content-card">
            <h4 class="card-title"><i class="fas fa-list me-2"></i>诊断记录列表</h4>
            
            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th><i class="fas fa-calendar me-1"></i>诊断日期</th>
                            <th><i class="fas fa-tag me-1"></i>诊断类型</th>
                            <th><i class="fas fa-file-alt me-1"></i>诊断名称</th>
                            <th><i class="fas fa-align-left me-1"></i>诊断描述</th>
                            <th><i class="fas fa-flag me-1"></i>诊断状态</th>
                            <th><i class="fas fa-user-md me-1"></i>医生</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(diagnoses)}">
                            <td colspan="6" class="text-center">
                                <i class="fas fa-info-circle me-2"></i>暂无诊断记录
                            </td>
                        </tr>
                        <tr th:each="diagnosis : ${diagnoses}">
                            <td>
                                <i class="fas fa-calendar-day me-1"></i>
                                <span th:text="${#dates.format(diagnosis.diagnosisDate, 'yyyy-MM-dd')}"></span>
                            </td>
                            <td>
                                <i class="fas fa-tag me-1"></i>
                                <span th:text="${diagnosis.diagnosisType}"></span>
                            </td>
                            <td>
                                <i class="fas fa-file-alt me-1"></i>
                                <span th:text="${diagnosis.diagnosisName}"></span>
                            </td>
                            <td>
                                <i class="fas fa-align-left me-1"></i>
                                <span th:text="${#strings.abbreviate(diagnosis.description, 30)}"></span>
                            </td>
                            <td>
                                <span th:if="${diagnosis.status == '确诊'}" class="badge bg-success">
                                    <i class="fas fa-check-circle me-1"></i>确诊
                                </span>
                                <span th:if="${diagnosis.status == '初步诊断'}" class="badge bg-warning text-dark">
                                    <i class="fas fa-info-circle me-1"></i>初步诊断
                                </span>
                                <span th:if="${diagnosis.status == '疑似'}" class="badge bg-info">
                                    <i class="fas fa-exclamation-circle me-1"></i>疑似
                                </span>
                                <span th:unless="${diagnosis.status == '确诊' or diagnosis.status == '初步诊断' or diagnosis.status == '疑似'}" class="badge bg-secondary" th:text="${diagnosis.status}"></span>
                            </td>
                            <td>
                                <i class="fas fa-user-md me-1"></i>
                                <span th:text="${diagnosis.doctor?.name}"></span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 引入Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
