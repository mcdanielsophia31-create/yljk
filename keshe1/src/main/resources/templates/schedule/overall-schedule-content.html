<!-- 页面标题 -->
<div class="schedule-header">
    <h1><i class="fas fa-calendar-alt me-2"></i>总体排班管理</h1>
    <p class="mb-0">查看和管理所有医生的排班信息</p>
</div>

<!-- 科室选择 -->
<div class="row mb-3">
    <div class="col-12">
        <div class="card">
            <div class="card-body">
                <div class="row align-items-center">
                    <div class="col-auto">
                        <label for="departmentSelect" class="form-label">请选择科室：</label>
                    </div>
                    <div class="col-auto">
                        <select class="form-select" id="departmentSelect" name="departmentId">
                            <option value="">加载中...</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 排班列表 -->
<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0"><i class="fas fa-list me-2"></i>排班列表</h5>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <button class="btn btn-primary me-2">
                        <i class="fas fa-plus me-1"></i>新增排班
                    </button>
                    <button class="btn btn-outline-primary">
                        <i class="fas fa-filter me-1"></i>筛选
                    </button>
                </div>
                
                <div id="schedules-container">
                    <div th:if="${schedules != null and !schedules.isEmpty()}" th:each="schedule : ${schedules}">
                        <div class="schedule-card">
                            <div class="schedule-card-header">
                                <span th:text="${schedule.doctorName}">医生姓名</span>
                                <span class="badge bg-secondary ms-2" th:text="${schedule.employeeId}">工号</span>
                            </div>
                            <div class="schedule-card-body">
                                <div class="schedule-info-item">
                                    <span class="schedule-info-label">排班日期:</span>
                                    <span class="schedule-info-value" th:text="${#dates.format(schedule.scheduleDate, 'yyyy-MM-dd')}">排班日期</span>
                                </div>
                                <div class="schedule-info-item">
                                    <span class="schedule-info-label">时间段:</span>
                                    <span class="schedule-info-value">
                                        <span class="time-slot-morning" th:if="${schedule.timeSlot == '上午'}" th:text="${schedule.timeSlot}">上午</span>
                                        <span class="time-slot-afternoon" th:if="${schedule.timeSlot == '下午'}" th:text="${schedule.timeSlot}">下午</span>
                                    </span>
                                </div>
                                <div class="schedule-info-item">
                                    <span class="schedule-info-label">诊室:</span>
                                    <span class="schedule-info-value" th:text="${schedule.roomNumber ?: '待分配'}">诊室号</span>
                                </div>
                                <div class="schedule-info-item">
                                    <span class="schedule-info-label">挂号费用:</span>
                                    <span class="schedule-info-value" th:text="${schedule.registrationFee} + '元'">挂号费用</span>
                                </div>
                                <div class="schedule-info-item">
                                    <span class="schedule-info-label">挂号限额:</span>
                                    <span class="schedule-info-value" th:text="${schedule.registrationQuota} + '/' + ${schedule.registeredCount}">限额/已挂号</span>
                                </div>
                                <div class="schedule-info-item">
                                    <span class="schedule-info-label">状态:</span>
                                    <span class="schedule-info-value">
                                        <span class="status-valid" th:if="${schedule.scheduleStatus == 'VALID'}">有效</span>
                                        <span class="status-cancelled" th:if="${schedule.scheduleStatus == 'CANCELLED'}">已取消</span>
                                        <span class="status-completed" th:if="${schedule.scheduleStatus == 'COMPLETED'}">已完成</span>
                                    </span>
                                </div>
                                <div class="mt-3">
                                    <button class="btn btn-sm btn-outline-primary me-2">
                                        <i class="fas fa-edit"></i> 编辑
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger">
                                        <i class="fas fa-trash"></i> 删除
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div th:if="${schedules == null or schedules.isEmpty()}" class="text-center py-5">
                        <i class="fas fa-calendar fa-3x text-muted mb-3"></i>
                        <p class="text-muted">暂无排班信息</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
$(document).ready(function() {
    // 加载科室列表
    loadDepartments();
});

function loadDepartments() {
    $.ajax({
        url: '/schedule/departments',
        type: 'GET',
        success: function(departments) {
            var select = $('#departmentSelect');
            select.empty();
            
            if (departments && departments.length > 0) {
                // 添加科室选项
                $.each(departments, function(index, department) {
                    select.append($('<option></option>')
                        .attr('value', department.id)
                        .text(department.name));
                });
                
                // 默认选择第一个科室
                select.val(departments[0].id);
                
                // 触发科室变更事件
                select.trigger('change');
            } else {
                select.append($('<option></option>')
                    .attr('value', '')
                    .text('暂无科室'));                
            }
        },
        error: function(xhr, status, error) {
            console.error('加载科室列表失败:', error);
            var select = $('#departmentSelect');
            select.empty();
            select.append($('<option></option>')
                .attr('value', '')
                .text('加载失败'));            
        }
    });
}
</script>
