<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单人排班 - 医疗健康管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/unified-style.css}">
    <style>
        .individual-schedule-header {
            background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
            color: white;
            padding: 25px 30px;
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }
        
        .doctor-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border: 1px solid #E5E7EB;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }
        
        .doctor-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
        }
        
        .doctor-card-header {
            padding: 15px 20px;
            background: #F9FAFB;
            border-bottom: 1px solid #E5E7EB;
            border-radius: 12px 12px 0 0 !important;
            font-weight: 600;
            color: #1F2937;
        }
        
        .doctor-card-body {
            padding: 20px;
        }
        
        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .schedule-item {
            border: 1px solid #E5E7EB;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            transition: all 0.2s ease;
        }
        
        .schedule-item:hover {
            border-color: #4F46E5;
            background: #F9FAFF;
        }
        
        .time-slot {
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .time-slot-morning {
            color: #1D4ED8;
        }
        
        .time-slot-afternoon {
            color: #92400E;
        }
        
        .schedule-date {
            font-size: 14px;
            color: #6B7280;
            margin-bottom: 10px;
        }
        
        .schedule-status {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
        }
        
        .status-available {
            background: #D1FAE5;
            color: #065F46;
        }
        
        .status-booked {
            background: #FEE2E2;
            color: #991B1B;
        }
        
        .status-full {
            background: #FDE68A;
            color: #92400E;
        }
        
        .room-selector {
            margin-bottom: 20px;
        }
        
        .doctor-selector {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <!-- 页面标题 -->
        <div class="individual-schedule-header">
            <h1><i class="fas fa-user-md me-2"></i>单人排班管理</h1>
            <p class="mb-0">为指定医生安排个人排班</p>
        </div>

        <!-- 选择医生和诊室 -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0"><i class="fas fa-user-md me-2"></i>选择医生</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">医生选择</label>
                            <select class="form-select" id="doctorSelect">
                                <option value="">请选择医生</option>
                                <option value="1">张医生 - 内科</option>
                                <option value="2">李医生 - 外科</option>
                                <option value="3">王医生 - 儿科</option>
                                <option value="4">赵医生 - 妇科</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">工号</label>
                            <input type="text" class="form-control" id="employeeId" placeholder="输入医生工号" readonly>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0"><i class="fas fa-hospital me-2"></i>选择诊室</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">诊室选择</label>
                            <select class="form-select" id="roomSelect">
                                <option value="">请选择诊室</option>
                                <option value="R101">R101 - 内科诊室</option>
                                <option value="R102">R102 - 外科诊室</option>
                                <option value="R103">R103 - 儿科诊室</option>
                                <option value="R201">R201 - 妇科诊室</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">诊室状态</label>
                            <select class="form-select" id="roomStatus">
                                <option value="NORMAL">正常</option>
                                <option value="MAINTENANCE">维护中</option>
                                <option value="DISABLED">已停用</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 排班安排 -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0"><i class="fas fa-calendar-week me-2"></i>排班安排</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">选择日期范围</label>
                            <div class="row">
                                <div class="col-md-5">
                                    <input type="date" class="form-control" id="startDate">
                                </div>
                                <div class="col-md-5">
                                    <input type="date" class="form-control" id="endDate">
                                </div>
                                <div class="col-md-2">
                                    <button class="btn btn-primary w-100" id="generateScheduleBtn">
                                        <i class="fas fa-sync me-1"></i>生成
                                    </button>
                                </div>
                            </div>
                        </div>
                        
                        <div class="schedule-grid" id="scheduleGrid">
                            <!-- 排班项目将通过JavaScript动态生成 -->
                            <div class="schedule-item">
                                <div class="time-slot time-slot-morning">上午</div>
                                <div class="schedule-date">2024-01-15</div>
                                <div class="schedule-status status-available">可预约</div>
                                <div class="mt-2">
                                    <button class="btn btn-sm btn-outline-primary">安排</button>
                                </div>
                            </div>
                            <div class="schedule-item">
                                <div class="time-slot time-slot-afternoon">下午</div>
                                <div class="schedule-date">2024-01-15</div>
                                <div class="schedule-status status-full">已满</div>
                                <div class="mt-2">
                                    <button class="btn btn-sm btn-outline-secondary" disabled>已安排</button>
                                </div>
                            </div>
                            <div class="schedule-item">
                                <div class="time-slot time-slot-morning">上午</div>
                                <div class="schedule-date">2024-01-16</div>
                                <div class="schedule-status status-booked">已预约</div>
                                <div class="mt-2">
                                    <button class="btn btn-sm btn-outline-primary">调整</button>
                                </div>
                            </div>
                            <div class="schedule-item">
                                <div class="time-slot time-slot-afternoon">下午</div>
                                <div class="schedule-date">2024-01-16</div>
                                <div class="schedule-status status-available">可预约</div>
                                <div class="mt-2">
                                    <button class="btn btn-sm btn-outline-primary">安排</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 页面交互逻辑
        document.addEventListener('DOMContentLoaded', function() {
            // 医生选择事件
            document.getElementById('doctorSelect').addEventListener('change', function() {
                const selectedOption = this.options[this.selectedIndex];
                if (selectedOption.value) {
                    document.getElementById('employeeId').value = selectedOption.text.split(' - ')[0] + '工号';
                } else {
                    document.getElementById('employeeId').value = '';
                }
            });
            
            // 生成排班按钮事件
            document.getElementById('generateScheduleBtn').addEventListener('click', function() {
                const startDate = document.getElementById('startDate').value;
                const endDate = document.getElementById('endDate').value;
                
                if (!startDate || !endDate) {
                    alert('请选择开始日期和结束日期');
                    return;
                }
                
                // 这里可以添加生成排班的逻辑
                alert('将生成从 ' + startDate + ' 到 ' + endDate + ' 的排班');
            });
        });
    </script>
</body>
</html>
